<html><head>
<script src="ws-config.js"></script>
<style type="text/css">

/* ── reset & shell ── */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Courier New',monospace; }
@keyframes scanlines {
  0%   { background-position:0 0; }
  100% { background-position:0 4px; }
}
@keyframes neonPulse {
  0%,100% { opacity:1; } 50% { opacity:.7; }
}
body {
  background:#020008;
  background-image:
    linear-gradient(rgba(0,255,200,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,200,.035) 1px, transparent 1px);
  background-size:40px 40px;
  display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
}
#LobbyWrapper {
  display:flex; flex-direction:column; width:1040px;
  box-shadow:0 0 80px rgba(0,255,200,.12), 0 0 2px rgba(0,255,200,.3);
}

/* ── top bar ── */
#TopBar {
  background:linear-gradient(90deg,#06001a,#0e0030,#06001a);
  color:#00ffcc; padding:5px 14px;
  display:flex; justify-content:space-between; align-items:center;
  font-size:10px; border-bottom:1px solid rgba(0,255,200,.25);
  letter-spacing:2px; text-transform:uppercase;
}
#VersionText { color:rgba(0,255,200,.35); }
#AnnouncementText {
  color:rgba(0,255,200,.7); letter-spacing:3px;
  animation:neonPulse 3s ease-in-out infinite;
}

/* ── middle row ── */
#MiddleRow { display:flex; height:375px; }
#ContentDiv { position:relative; width:750px; height:375px; flex-shrink:0; overflow:hidden; }

/* ── sidebar ── */
#Sidebar {
  width:290px;
  background:linear-gradient(180deg,#07001c,#050012);
  display:flex; flex-direction:column;
  border-left:1px solid rgba(0,255,200,.2);
}
#PlayerCountDiv {
  background:#040010; color:#00ffcc; padding:7px 12px;
  font-size:11px; font-weight:bold; border-bottom:1px solid rgba(0,255,200,.15);
  letter-spacing:2px; flex-shrink:0;
}

/* ── name change row ── */
#PlayerNameDiv {
  background:#040010; color:#666; padding:5px 12px;
  font-size:11px; border-bottom:1px solid rgba(0,255,200,.12);
  display:flex; align-items:center; gap:6px; flex-shrink:0;
}
#PlayerNameDisplay { color:#00ffcc; font-weight:bold; }
#PlayerNameEditBtn { cursor:pointer; color:#333; font-size:12px; margin-left:auto; }
#PlayerNameEditBtn:hover { color:#00ffcc; }
#PlayerNameEditArea { display:none; flex:1; align-items:center; gap:4px; }
#PlayerNameInput {
  flex:1; background:#020008; border:1px solid rgba(0,255,200,.35); color:#eee;
  padding:3px 6px; font-size:11px; font-family:inherit;
}
#PlayerNameInput:focus { outline:none; border-color:#00ffcc; box-shadow:0 0 6px rgba(0,255,200,.25); }
.name-btn { cursor:pointer; font-size:13px; padding:1px 5px; }
.name-confirm { color:#00ffcc; } .name-confirm:hover { color:#66ffdd; }
.name-cancel  { color:#ff00cc; } .name-cancel:hover  { color:#ff66ee; }

/* ── in-room leave button ── */
#LeaveRoomBtn {
  display:none; background:transparent; color:#ff3377;
  border:none; border-bottom:1px solid rgba(255,51,119,.2);
  padding:5px 12px; font-size:10px; font-family:inherit;
  letter-spacing:2px; text-transform:uppercase; cursor:pointer;
  text-align:left; flex-shrink:0;
}
#LeaveRoomBtn:hover { background:rgba(255,51,119,.08); color:#ff66aa; }

/* ── chat ── */
#ChatLog {
  flex:1; overflow-y:auto; padding:7px;
  display:flex; flex-direction:column; gap:3px; min-height:0;
}
#ChatLog::-webkit-scrollbar { width:2px; }
#ChatLog::-webkit-scrollbar-track { background:#040010; }
#ChatLog::-webkit-scrollbar-thumb { background:#2a0044; }
.chat-msg  { font-size:11px; color:#8876aa; word-break:break-word; line-height:1.5; }
.chat-name { color:#00ffcc; font-weight:bold; }
.chat-sys  { color:#332255; font-style:italic; font-size:10px; }
#ChatInputRow {
  display:flex; border-top:1px solid rgba(0,255,200,.12); padding:5px; gap:4px;
  background:#040010; flex-shrink:0;
}
#ChatInput {
  flex:1; background:#020008; border:1px solid #1a0033; color:#bbb;
  padding:5px 7px; font-size:11px; font-family:inherit;
}
#ChatInput:focus { outline:none; border-color:rgba(0,255,200,.4); }
#ChatSendBtn {
  background:transparent; border:1px solid rgba(0,255,200,.3); color:#00ffcc;
  padding:5px 9px; cursor:pointer; font-size:12px; font-family:inherit;
}
#ChatSendBtn:hover { background:rgba(0,255,200,.1); border-color:#00ffcc; }

/* ── bottom bar ── */
#BottomBar {
  background:linear-gradient(90deg,#06001a,#0e0030,#06001a);
  display:flex; align-items:center; justify-content:center;
  padding:10px 16px; gap:6px;
  border-top:1px solid rgba(0,255,200,.2);
  position:relative;
}
#BottomBar::before {
  content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
  background:linear-gradient(90deg,transparent,#00ffcc,#ff00cc,#00ffcc,transparent);
}
.bigBtn {
  background:transparent; border:1px solid rgba(0,255,200,.4);
  color:#00ffcc; padding:10px 18px;
  font-size:11px; font-weight:bold; letter-spacing:2.5px;
  cursor:pointer; text-transform:uppercase;
  user-select:none; display:inline-block;
  font-family:'Courier New',monospace; transition:all .15s;
  position:relative; overflow:hidden;
}
.bigBtn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,255,200,.06) 0%,transparent 70%);
}
.bigBtn:hover {
  background:rgba(0,255,200,.1); border-color:#00ffcc;
  box-shadow:0 0 18px rgba(0,255,200,.25),inset 0 0 12px rgba(0,255,200,.05);
  color:#fff;
}
.bigBtn:active { background:rgba(0,255,200,.2); }
.bigBtn.magenta { border-color:rgba(255,0,204,.4); color:#ff00cc; }
.bigBtn.magenta:hover { background:rgba(255,0,204,.1); border-color:#ff00cc; box-shadow:0 0 18px rgba(255,0,204,.25); color:#fff; }
.bigBtn.gold { border-color:rgba(255,200,0,.4); color:#ffc800; }
.bigBtn.gold:hover { background:rgba(255,200,0,.1); border-color:#ffc800; box-shadow:0 0 18px rgba(255,200,0,.2); color:#fff; }
#OptionsBtn {
  color:rgba(0,255,200,.3); font-size:10px; cursor:pointer; margin-left:6px;
  letter-spacing:2px; text-transform:uppercase; user-select:none;
  font-family:'Courier New',monospace; background:none; border:none;
  transition:color .15s;
}
#OptionsBtn:hover { color:#00ffcc; }

/* ── lobby select ── */
.lobby-list-wrap { padding:4px 8px 0; background:#07001c; min-height:100%; }
.lobby-title {
  text-align:center; font-size:12px; font-weight:bold; letter-spacing:4px;
  text-transform:uppercase; color:#00ffcc; margin-bottom:8px; padding-top:10px;
  text-shadow:0 0 14px rgba(0,255,200,.6);
}
.lobby-row {
  border:1px solid rgba(255,255,255,.07);
  padding:7px 10px; margin-bottom:3px; cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:all .12s;
}
.lobby-row:hover { border-color:rgba(255,255,255,.2); filter:brightness(1.4); }
.lobby-name  { flex:1; font-weight:bold; font-size:11px; letter-spacing:.5px; }
.lobby-dots  { font-size:12px; letter-spacing:2px; }
.lobby-spec  { font-size:10px; color:#666; white-space:nowrap; }
.lobby-badge { font-size:10px; font-weight:bold; white-space:nowrap; min-width:80px; text-align:right; letter-spacing:.5px; }
.badge-empty   { color:#333; }
.badge-waiting { color:#ff9900; text-shadow:0 0 6px rgba(255,153,0,.5); }
.badge-playing { color:#00ff88; text-shadow:0 0 6px rgba(0,255,136,.5); }
.lobby-back { text-align:center; margin-top:6px; padding-bottom:4px; }

/* ── spectator overlay ── */
.spec-overlay {
  position:absolute; top:8px; left:8px;
  background:rgba(0,0,16,.8); color:#00ffcc;
  font-size:9px; font-weight:bold; letter-spacing:3px;
  padding:4px 10px; border:1px solid rgba(0,255,200,.35); pointer-events:none;
  text-transform:uppercase;
}

/* ── options panel ── */
#OptionsDiv {
  background:#07001c !important;
  border:1px solid rgba(0,255,200,.3) !important;
  color:#aaa;
}
#OptionsDiv h2,#OptionsDiv h3 { color:#00ffcc; letter-spacing:2px; }

/* ── game ui ── */
h1 { font-size:60px; }
h2 { margin:8px 0; }
.SmallButton { text-decoration:none; cursor:pointer; color:#444; letter-spacing:1px; }
.SmallButton:hover { color:#00ffcc; }
.btn {
  background:transparent; border:1px solid rgba(0,255,200,.45);
  color:#00ffcc; padding:10px 22px; font-family:'Courier New',monospace;
  text-decoration:none; cursor:pointer; user-select:none;
  letter-spacing:2px; font-size:13px; display:inline-block; transition:all .15s;
}
.btn:hover { background:rgba(0,255,200,.12); border-color:#00ffcc; box-shadow:0 0 14px rgba(0,255,200,.3); color:#fff; }
.btn.pink { border-color:rgba(255,0,204,.45); color:#ff00cc; }
.btn.pink:hover { background:rgba(255,0,204,.12); border-color:#ff00cc; box-shadow:0 0 14px rgba(255,0,204,.3); color:#fff; }
input[type='checkbox'] { margin-right:1em; accent-color:#00ffcc; }

</style>

<script type="text/javascript">

var physicsLog = 0;
var TWO_PI = Math.PI * 2;
var WIN_AMOUNT = 7;

function newLegacyBall(radius, color) {
  return {
    radius:radius, color:color, x:0, y:0, velocityX:0, velocityY:0, rotation:0,
    render: function() {
      var xPix = this.x * pixelsPerUnitX;
      var yPix = courtYPix - (this.y * pixelsPerUnitY);
      var rPix = this.radius * pixelsPerUnitY + 2;
      if (ballImage && !legacyGraphics) {
        this.rotation = (this.rotation + this.velocityX / 100) % TWO_PI;
        ctx.translate(xPix, yPix); ctx.rotate(this.rotation);
        ctx.drawImage(ballImage, -rPix, -rPix);
        ctx.setTransform(1,0,0,1,0,0);
      } else {
        ctx.fillStyle = legacyBallColor;
        ctx.beginPath(); ctx.arc(xPix, yPix, rPix, 0, TWO_PI); ctx.fill();
      }
    }
  };
}

function newLegacySlime(onLeft, radius, color) {
  return {
    onLeft:onLeft, radius:radius, color:color, img:null, x:0, y:0, velocityX:0, velocityY:0,
    render: function() {
      var xPix = this.x * pixelsPerUnitX;
      var yPix = courtYPix - (this.y * pixelsPerUnitY);
      var rPix = this.radius * pixelsPerUnitY;
      if (this.img && !legacyGraphics) {
        ctx.drawImage(this.img, xPix - rPix, yPix - 38);
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(xPix, yPix, rPix, Math.PI, TWO_PI); ctx.fill();
      }
      var eyeX = this.x + (this.onLeft ? 1 : -1) * this.radius / 4;
      var eyeY = this.y + this.radius / 2;
      ctx.translate(eyeX * pixelsPerUnitX, courtYPix - eyeY * pixelsPerUnitY);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, rPix/4, 0, TWO_PI); ctx.fill();
      var dx = ball.x - eyeX, dy = eyeY - ball.y;
      var dist = Math.sqrt(dx*dx + dy*dy) || 1;
      var r8 = rPix / 8;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(r8*dx/dist, r8*dy/dist, r8, 0, TWO_PI); ctx.fill();
      ctx.setTransform(1,0,0,1,0,0);
    }
  };
}

var GAME_STATE_RUNNING = 1, GAME_STATE_POINT_PAUSE = 2,
    GAME_STATE_MENU_PAUSE = 3, GAME_STATE_MENU_PAUSE_BETWEEN_POINTS = 4,
    GAME_STATE_SHOW_WINNER = 5;

var menuDiv, smallMenuDiv, onePlayer, nextSlimeIndex, gameState;
var ctx, canvas, viewWidth, viewHeight, courtYPix, pixelsPerUnitX, pixelsPerUnitY;
var updatesToPaint, legacySkyColor, legacyGroundColor, legacyBallColor, newGroundColor;
var backImage, backTextColor, backImages = {}, ballImage, gameIntervalObject, endOfPointText;
var greenSlimeImage, redSlimeImage, legacyGraphics;
var gameWidth, gameHeight, ball, slimeLeft, slimeRight, slimeLeftScore, slimeRightScore;
var slimeAI, updateCount, leftWon, slowMotion, logString;

function log(msg) { logString += msg + '\n'; }

// ── local game physics ────────────────────────────────────
function updateSlimeVelocities(s, movement, jump) {
  s.velocityX = movement === 1 ? -8 : movement === 2 ? 8 : 0;
  if (jump && s.y === 0) s.velocityY = 31;
}
function updateSlimeVelocitiesWithKeys(s, left, right, up) {
  if (keysDown[left])       s.velocityX = keysDown[right] ? 0 : -8;
  else if (keysDown[right]) s.velocityX = 8;
  else                      s.velocityX = 0;
  if (s.y === 0 && keysDown[up]) s.velocityY = 31;
}
function updateSlimeVelocitiesWithDoubleKeys(s, l1, l2, r1, r2, u1, u2) {
  if (keysDown[l1] || keysDown[l2])       s.velocityX = (keysDown[r1] || keysDown[r2]) ? 0 : -8;
  else if (keysDown[r1] || keysDown[r2])  s.velocityX = 8;
  else                                     s.velocityX = 0;
  if (s.y === 0 && (keysDown[u1] || keysDown[u2])) s.velocityY = 31;
}
function updateSlime(s, lLimit, rLimit) {
  if (s.velocityX) {
    s.x = Math.min(Math.max(s.x + s.velocityX, lLimit), rLimit);
  }
  if (s.velocityY || s.y > 0) {
    s.velocityY -= 2; s.y += s.velocityY;
    if (s.y < 0) { s.y = 0; s.velocityY = 0; }
  }
}
var MAX_VELOCITY_X = 15, MAX_VELOCITY_Y = 22, FUDGE = 5;
function collisionBallSlime(s) {
  var dx = 2*(ball.x - s.x), dy = ball.y - s.y;
  var dist = Math.trunc(Math.sqrt(dx*dx + dy*dy));
  if (dy > 0 && dist < ball.radius + s.radius && dist > FUDGE) {
    ball.x = s.x + Math.trunc(Math.trunc((s.radius+ball.radius)/2)*dx/dist);
    ball.y = s.y + Math.trunc((s.radius+ball.radius)*dy/dist);
    var dot = Math.trunc((dx*(ball.velocityX-s.velocityX) + dy*(ball.velocityY-s.velocityY))/dist);
    if (dot <= 0) {
      ball.velocityX = Math.min(Math.max(ball.velocityX + Math.trunc(s.velocityX - 2*dx*dot/dist), -MAX_VELOCITY_X), MAX_VELOCITY_X);
      ball.velocityY = Math.min(Math.max(ball.velocityY + Math.trunc(s.velocityY - 2*dy*dot/dist), -MAX_VELOCITY_Y), MAX_VELOCITY_Y);
    }
  }
}
function updateBall() {
  ball.velocityY = Math.max(ball.velocityY - 1, -MAX_VELOCITY_Y);
  ball.x += ball.velocityX; ball.y += ball.velocityY;
  collisionBallSlime(slimeLeft); collisionBallSlime(slimeRight);
  if (ball.x < 15)   { ball.x = 15;  ball.velocityX = -ball.velocityX; }
  else if (ball.x > 985) { ball.x = 985; ball.velocityX = -ball.velocityX; }
  if (ball.x > 480 && ball.x < 520 && ball.y < 140) {
    if (ball.velocityY < 0 && ball.y > 130) { ball.velocityY *= -1; ball.y = 130; }
    else if (ball.x < 500) { ball.x = 480; ball.velocityX = ball.velocityX >= 0 ? -ball.velocityX : ball.velocityX; }
    else                   { ball.x = 520; ball.velocityX = ball.velocityX <= 0 ? -ball.velocityX : ball.velocityX; }
  }
  if (ball.y < 0) {
    leftWon = ball.x > 500; (leftWon ? slimeLeftScore++ : slimeRightScore++);
    endPoint(); return true;
  }
  return false;
}
function updateFrame() {
  if (onePlayer) {
    slimeAI.move(false);
    updateSlimeVelocitiesWithDoubleKeys(slimeLeft, KEY_A,KEY_LEFT, KEY_D,KEY_RIGHT, KEY_W,KEY_UP);
    updateSlimeVelocities(slimeRight, slimeAI.movement, slimeAI.jumpSet);
  } else {
    updateSlimeVelocitiesWithKeys(slimeLeft,  KEY_A,    KEY_D,     KEY_W);
    updateSlimeVelocitiesWithKeys(slimeRight, KEY_LEFT, KEY_RIGHT, KEY_UP);
  }
  updateSlime(slimeLeft, 50, 445); updateSlime(slimeRight, 555, 950);
  updateBall();
}

// ── rendering ─────────────────────────────────────────────
function drawMapBackground(id) {
  var w = viewWidth, h = viewHeight, gy = courtYPix, cx = ctx;
  switch (id) {

    case 0: { // Sky Court — bright day with clouds
      var sg = cx.createLinearGradient(0, 0, 0, gy);
      sg.addColorStop(0, '#1a6bb5'); sg.addColorStop(1, '#a8d8f0');
      cx.fillStyle = sg; cx.fillRect(0, 0, w, gy);
      cx.fillStyle = '#ffe566'; cx.beginPath(); cx.arc(80, 55, 32, 0, TWO_PI); cx.fill();
      cx.fillStyle = '#fff9cc'; cx.beginPath(); cx.arc(80, 55, 22, 0, TWO_PI); cx.fill();
      function cloud(x,y,s) {
        cx.fillStyle = 'rgba(255,255,255,0.9)';
        cx.beginPath(); cx.arc(x,y,s,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(x+s*1.3,y+s*0.35,s*.7,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(x-s*1.1,y+s*0.4,s*.65,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(x+s*.4,y-s*.5,s*.6,0,TWO_PI); cx.fill();
      }
      cloud(160,68,22); cloud(400,50,18); cloud(590,78,25); cloud(690,44,14);
      var gg = cx.createLinearGradient(0,gy,0,h);
      gg.addColorStop(0,'#5cb85c'); gg.addColorStop(1,'#3a7a3a');
      cx.fillStyle = gg; cx.fillRect(0,gy,w,h-gy);
      backTextColor = '#222'; break;
    }

    case 1: { // Cave Court — dark crystals and stalactites
      cx.fillStyle = '#080810'; cx.fillRect(0, 0, w, gy);
      cx.fillStyle = '#1e1630';
      for (var i = 0; i < 15; i++) {
        var sx = i * 52 + 15, sh = 28 + Math.sin(i * 1.9) * 18 + (i%3)*12;
        cx.beginPath(); cx.moveTo(sx-11,0); cx.lineTo(sx+11,0); cx.lineTo(sx,sh); cx.closePath(); cx.fill();
      }
      function crystal(x,y,col) {
        cx.shadowColor = col; cx.shadowBlur = 18; cx.fillStyle = col;
        cx.beginPath(); cx.moveTo(x,y-22); cx.lineTo(x+9,y); cx.lineTo(x,y+9); cx.lineTo(x-9,y); cx.closePath(); cx.fill();
        cx.shadowBlur = 0;
      }
      crystal(14,175,'#00ffcc'); crystal(24,218,'#7b2fff'); crystal(10,260,'#00ccff');
      crystal(736,168,'#ff00aa'); crystal(742,210,'#00ffcc'); crystal(730,252,'#7b2fff');
      cx.fillStyle = 'rgba(0,255,200,.07)'; cx.beginPath(); cx.arc(18,218,45,0,TWO_PI); cx.fill();
      cx.fillStyle = 'rgba(123,47,255,.07)'; cx.beginPath(); cx.arc(736,210,45,0,TWO_PI); cx.fill();
      var cgg = cx.createLinearGradient(0,gy,0,h);
      cgg.addColorStop(0,'#1a1228'); cgg.addColorStop(1,'#0d0d1a');
      cx.fillStyle = cgg; cx.fillRect(0,gy,w,h-gy);
      cx.fillStyle = '#2a2038';
      for (var j = 0; j < 8; j++) { cx.beginPath(); cx.ellipse(j*100+30,gy+6,18,8,0,0,TWO_PI); cx.fill(); }
      backTextColor = '#00ffcc'; break;
    }

    case 2: { // Sunset Court — purple-orange dusk with silhouette peaks
      var sun2 = cx.createLinearGradient(0,0,0,gy);
      sun2.addColorStop(0,'#1a0a2e'); sun2.addColorStop(0.4,'#8b2252');
      sun2.addColorStop(0.75,'#e85d04'); sun2.addColorStop(1,'#f9c74f');
      cx.fillStyle = sun2; cx.fillRect(0,0,w,gy);
      cx.fillStyle = '#ffd60a'; cx.beginPath(); cx.arc(375,gy+4,45,Math.PI,TWO_PI); cx.fill();
      cx.fillStyle = 'rgba(255,200,50,.28)'; cx.beginPath(); cx.arc(375,gy+4,82,Math.PI,TWO_PI); cx.fill();
      cx.fillStyle = '#2d1b4e';
      function mtn(x,mw,mh) { cx.beginPath(); cx.moveTo(x-mw,gy); cx.lineTo(x,gy-mh); cx.lineTo(x+mw,gy); cx.closePath(); cx.fill(); }
      mtn(100,110,120); mtn(250,90,90); mtn(165,80,68);
      mtn(600,120,140); mtn(680,85,95); mtn(540,72,80);
      var sgg = cx.createLinearGradient(0,gy,0,h);
      sgg.addColorStop(0,'#c9722a'); sgg.addColorStop(1,'#7a3d10');
      cx.fillStyle = sgg; cx.fillRect(0,gy,w,h-gy);
      backTextColor = '#fff'; break;
    }

    case 3: { // Storm Court — lightning, rain, dark clouds
      var stg = cx.createLinearGradient(0,0,0,gy);
      stg.addColorStop(0,'#0a0a18'); stg.addColorStop(0.5,'#1c1c38'); stg.addColorStop(1,'#28204e');
      cx.fillStyle = stg; cx.fillRect(0,0,w,gy);
      cx.fillStyle = 'rgba(38,38,75,.88)';
      function scloud(x,y,r) {
        cx.beginPath(); cx.arc(x,y,r,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(x+r*.8,y+5,r*.7,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(x-r*.9,y+8,r*.65,0,TWO_PI); cx.fill();
      }
      scloud(130,50,40); scloud(350,40,52); scloud(580,55,46); scloud(700,36,34);
      cx.strokeStyle = 'rgba(255,255,180,.8)'; cx.lineWidth = 3;
      cx.beginPath(); cx.moveTo(200,55); cx.lineTo(188,130); cx.lineTo(202,130); cx.lineTo(183,215); cx.stroke();
      cx.strokeStyle = 'rgba(255,255,200,.25)'; cx.lineWidth = 9;
      cx.beginPath(); cx.moveTo(200,55); cx.lineTo(188,130); cx.lineTo(202,130); cx.lineTo(183,215); cx.stroke();
      cx.strokeStyle = 'rgba(140,170,255,.22)'; cx.lineWidth = 1;
      for (var ri = 0; ri < 45; ri++) {
        var rx = (ri*127+40)%750, ry = (ri*83+15)%(gy-30);
        cx.beginPath(); cx.moveTo(rx,ry); cx.lineTo(rx-4,ry+18); cx.stroke();
      }
      cx.lineWidth = 1;
      var mgg = cx.createLinearGradient(0,gy,0,h);
      mgg.addColorStop(0,'#2a1e0e'); mgg.addColorStop(1,'#180e06');
      cx.fillStyle = mgg; cx.fillRect(0,gy,w,h-gy);
      cx.fillStyle = 'rgba(70,95,155,.35)';
      cx.beginPath(); cx.ellipse(210,gy+25,52,10,0,0,TWO_PI); cx.fill();
      cx.beginPath(); cx.ellipse(560,gy+30,40,8,0,0,TWO_PI); cx.fill();
      backTextColor = '#ffee66'; break;
    }

    case 4: { // Jungle Court — dense canopy with hanging vines
      var jsg = cx.createLinearGradient(0,0,0,gy);
      jsg.addColorStop(0,'#0d2200'); jsg.addColorStop(0.5,'#1e4806'); jsg.addColorStop(1,'#366a12');
      cx.fillStyle = jsg; cx.fillRect(0,0,w,gy);
      [30,95,195,335,430,565,660,715].forEach(function(tx) {
        var tw = 14+(tx%10);
        cx.fillStyle = '#120a02';
        cx.fillRect(tx-tw/2, gy-165, tw, 165);
        cx.fillStyle = 'rgba(10,50,2,.9)';
        cx.beginPath(); cx.arc(tx,gy-158,40,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(tx+20,gy-142,30,0,TWO_PI); cx.fill();
        cx.beginPath(); cx.arc(tx-20,gy-148,32,0,TWO_PI); cx.fill();
      });
      cx.strokeStyle = 'rgba(22,75,8,.75)'; cx.lineWidth = 3;
      [75,220,385,500,645].forEach(function(vx) {
        var vl = 65+(vx%80);
        cx.beginPath(); cx.moveTo(vx,0);
        cx.bezierCurveTo(vx+20,vl/3,vx-15,vl*.6,vx+5,vl); cx.stroke();
      });
      cx.lineWidth = 1;
      var jgg = cx.createLinearGradient(0,gy,0,h);
      jgg.addColorStop(0,'#281802'); jgg.addColorStop(1,'#160e02');
      cx.fillStyle = jgg; cx.fillRect(0,gy,w,h-gy);
      cx.fillStyle = '#266010';
      for (var ti = 0; ti < 22; ti++) { cx.beginPath(); cx.arc(ti*35+5,gy,8,Math.PI,TWO_PI); cx.fill(); }
      backTextColor = '#aaff66'; break;
    }

    case 5: { // Frozen Court — aurora, ice peaks, snow
      var fsg = cx.createLinearGradient(0,0,0,gy);
      fsg.addColorStop(0,'#b0cce8'); fsg.addColorStop(1,'#e2f2fc');
      cx.fillStyle = fsg; cx.fillRect(0,0,w,gy);
      cx.globalAlpha = 0.14;
      ['#00ff88','#00ccff','#aa44ff'].forEach(function(ac,ai) {
        var ag = cx.createLinearGradient(ai*210,0,ai*210+160,gy*.6);
        ag.addColorStop(0,'transparent'); ag.addColorStop(.5,ac); ag.addColorStop(1,'transparent');
        cx.fillStyle = ag; cx.fillRect(ai*210+30,0,120,gy*.6);
      });
      cx.globalAlpha = 1;
      function icePeak(x,mw,mh,col) {
        cx.fillStyle = col;
        cx.beginPath(); cx.moveTo(x-mw,gy); cx.lineTo(x,gy-mh);
        cx.lineTo(x+mw*.35,gy-mh*.7); cx.lineTo(x+mw,gy); cx.closePath(); cx.fill();
        cx.fillStyle = '#fff';
        cx.beginPath(); cx.moveTo(x-18,gy-mh+32); cx.lineTo(x,gy-mh); cx.lineTo(x+18,gy-mh+32); cx.closePath(); cx.fill();
      }
      icePeak(75,105,112,'#b8d8f0'); icePeak(200,82,88,'#cce4ff');
      icePeak(625,115,128,'#b0d0ec'); icePeak(705,78,82,'#cce4ff');
      cx.fillStyle = 'rgba(255,255,255,.75)';
      for (var sfi = 0; sfi < 32; sfi++) {
        cx.beginPath(); cx.arc((sfi*101+25)%750,(sfi*73+12)%gy, 1.5+(sfi%3), 0, TWO_PI); cx.fill();
      }
      var fgg = cx.createLinearGradient(0,gy,0,h);
      fgg.addColorStop(0,'#c5e5ff'); fgg.addColorStop(1,'#9dc8ee');
      cx.fillStyle = fgg; cx.fillRect(0,gy,w,h-gy);
      cx.fillStyle = 'rgba(255,255,255,.4)'; cx.fillRect(0,gy,w,4);
      backTextColor = '#1a5580'; break;
    }

    case 6: { // Desert Court — scorching sun, cacti, dunes
      var dsg = cx.createLinearGradient(0,0,0,gy);
      dsg.addColorStop(0,'#0d5fa5'); dsg.addColorStop(0.55,'#e8871a'); dsg.addColorStop(1,'#f5c842');
      cx.fillStyle = dsg; cx.fillRect(0,0,w,gy);
      cx.fillStyle = '#fff176'; cx.beginPath(); cx.arc(650,58,46,0,TWO_PI); cx.fill();
      cx.fillStyle = '#ffee44'; cx.beginPath(); cx.arc(650,58,34,0,TWO_PI); cx.fill();
      cx.strokeStyle = 'rgba(255,230,50,.38)'; cx.lineWidth = 3;
      for (var ray = 0; ray < 12; ray++) {
        var ra = (ray/12)*TWO_PI;
        cx.beginPath(); cx.moveTo(650+Math.cos(ra)*46,58+Math.sin(ra)*46);
        cx.lineTo(650+Math.cos(ra)*72,58+Math.sin(ra)*72); cx.stroke();
      }
      cx.lineWidth = 1;
      cx.fillStyle = '#c8882a';
      cx.beginPath(); cx.moveTo(0,gy);
      cx.bezierCurveTo(120,gy-52,250,gy-20,375,gy-42);
      cx.bezierCurveTo(500,gy-62,630,gy-14,750,gy-38);
      cx.lineTo(750,gy); cx.closePath(); cx.fill();
      cx.fillStyle = '#2d6a2d';
      function cactus(x,by) {
        cx.fillRect(x-5,by-58,10,58);
        cx.fillRect(x-20,by-40,16,8); cx.fillRect(x-20,by-58,8,22);
        cx.fillRect(x+5,by-32,16,8);  cx.fillRect(x+12,by-50,8,22);
      }
      cactus(105,gy); cactus(635,gy); cactus(55,gy-6);
      var dgg = cx.createLinearGradient(0,gy,0,h);
      dgg.addColorStop(0,'#e8b84b'); dgg.addColorStop(1,'#c49028');
      cx.fillStyle = dgg; cx.fillRect(0,gy,w,h-gy);
      cx.fillStyle = 'rgba(200,160,50,.45)';
      for (var sd = 0; sd < 28; sd++) { cx.beginPath(); cx.arc((sd*117+38)%750,gy+10+(sd*39)%55,3,0,TWO_PI); cx.fill(); }
      backTextColor = '#5a2d00'; break;
    }

    case 7: // Neon Court — cyberpunk grid city
    default: {
      cx.fillStyle = '#00000f'; cx.fillRect(0,0,w,h);
      // Sky grid
      cx.strokeStyle = 'rgba(180,0,255,.14)'; cx.lineWidth = 1;
      for (var gr = 1; gr < 8; gr++) { cx.beginPath(); cx.moveTo(0,gr*(gy/8)); cx.lineTo(w,gr*(gy/8)); cx.stroke(); }
      for (var gc = 0; gc <= 16; gc++) { cx.beginPath(); cx.moveTo(gc*(w/16),0); cx.lineTo(gc*(w/16),gy); cx.stroke(); }
      // Neon city silhouette
      var bldgs = [[45,88,38],[98,62,48],[168,95,33],[238,52,58],[318,78,38],[432,58,62],[518,90,48],[598,62,43],[658,84,52],[710,52,38]];
      bldgs.forEach(function(b) {
        cx.fillStyle = '#08001e';
        cx.fillRect(b[0],gy-b[1],b[2],b[1]);
        cx.fillStyle = 'rgba(0,255,200,.35)';
        for (var wi = 0; wi < 3; wi++) {
          cx.fillRect(b[0]+4+wi*10,gy-b[1]+10,5,5);
          cx.fillRect(b[0]+4+wi*10,gy-b[1]+24,5,5);
        }
      });
      // Central orb
      var ng = cx.createRadialGradient(375,gy*.38,4,375,gy*.38,62);
      ng.addColorStop(0,'rgba(255,0,200,.85)'); ng.addColorStop(.5,'rgba(140,0,255,.3)'); ng.addColorStop(1,'transparent');
      cx.fillStyle = ng; cx.beginPath(); cx.arc(375,gy*.38,62,0,TWO_PI); cx.fill();
      // Sky border glow
      cx.strokeStyle = '#ff00cc'; cx.lineWidth = 2;
      cx.shadowColor = '#ff00cc'; cx.shadowBlur = 12;
      cx.strokeRect(1,1,w-2,gy-1); cx.shadowBlur = 0; cx.lineWidth = 1;
      // Ground with perspective grid
      var ngg = cx.createLinearGradient(0,gy,0,h);
      ngg.addColorStop(0,'#100028'); ngg.addColorStop(1,'#06000f');
      cx.fillStyle = ngg; cx.fillRect(0,gy,w,h-gy);
      cx.strokeStyle = 'rgba(0,255,200,.28)'; cx.lineWidth = 1;
      for (var gl = 0; gl <= 5; gl++) {
        var gy2 = gy + (h-gy)*(gl/5);
        cx.beginPath(); cx.moveTo(0,gy2); cx.lineTo(w,gy2); cx.stroke();
      }
      var vp = w/2;
      for (var gv = 0; gv <= 12; gv++) {
        var fx = gv*(w/12);
        cx.beginPath(); cx.moveTo(fx,gy); cx.lineTo(vp+(fx-vp)*.12,h); cx.stroke();
      }
      // Ground neon line
      cx.strokeStyle = '#00ffcc'; cx.lineWidth = 2;
      cx.shadowColor = '#00ffcc'; cx.shadowBlur = 10;
      cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(w,gy); cx.stroke();
      cx.shadowBlur = 0; cx.lineWidth = 1;
      backTextColor = '#00ffcc'; break;
    }
  }
}

function renderPoints(score, x0, dx) {
  ctx.fillStyle = '#ff0';
  for (var i = 0, x = x0; i < score; i++, x += dx) {
    ctx.beginPath(); ctx.arc(x, 25, 12, 0, TWO_PI); ctx.fill();
  }
  ctx.strokeStyle = backTextColor; ctx.lineWidth = 2;
  for (var i = 0, x = x0; i < WIN_AMOUNT; i++, x += dx) {
    ctx.beginPath(); ctx.arc(x, 25, 12, 0, TWO_PI); ctx.stroke();
  }
}
function renderBackground() {
  if (legacyGraphics) {
    ctx.fillStyle = legacySkyColor; ctx.fillRect(0, 0, viewWidth, courtYPix);
    ctx.fillStyle = legacyGroundColor;
    ctx.fillRect(0, courtYPix, viewWidth, viewHeight - courtYPix);
  } else if (currentRoomId !== null) {
    drawMapBackground(currentRoomId);
  } else if (backImage) {
    ctx.drawImage(backImage, 0, 0);
    ctx.fillStyle = newGroundColor;
    ctx.fillRect(0, courtYPix, viewWidth, viewHeight - courtYPix);
  } else {
    ctx.fillStyle = '#88ccff'; ctx.fillRect(0, 0, viewWidth, courtYPix);
    ctx.fillStyle = '#ca6'; ctx.fillRect(0, courtYPix, viewWidth, viewHeight - courtYPix);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(viewWidth/2-2, 7*viewHeight/10, 4, viewHeight/10+5);
  renderPoints(slimeLeftScore, 30, 40);
  renderPoints(slimeRightScore, viewWidth-30, -40);
}
function renderGame() {
  if (updatesToPaint === 0) return;
  renderBackground(); ball.render(); slimeLeft.render(); slimeRight.render();
  updatesToPaint = 0;
}
function renderEndOfPoint() {
  renderGame();
  var w = ctx.measureText(endOfPointText).width;
  ctx.fillStyle = '#000';
  ctx.fillText(endOfPointText, (viewWidth-w)/2, courtYPix + (viewHeight-courtYPix)/2);
}

function gameIteration() {
  if (gameState !== GAME_STATE_RUNNING) return;
  updateCount++;
  if (slowMotion && updateCount % 2 === 0) return;
  updateFrame();
  updatesToPaint++;
  if (updatesToPaint === 1) requestAnimationFrame(renderGame);
}

// ── local game flow ───────────────────────────────────────
function endPoint() {
  if (slimeAI) { keysDown[KEY_UP]=false; keysDown[KEY_RIGHT]=false; keysDown[KEY_LEFT]=false; }
  if (slimeLeftScore  >= WIN_AMOUNT) { endMatch(); return; }
  if (slimeRightScore >= WIN_AMOUNT) { endMatch(); return; }
  endOfPointText = onePlayer
    ? (leftWon ? 'Nice, you got the point!' : slimeAI.name + ' scores!')
    : ('Player ' + (leftWon ? '1':'2') + ' scores!');
  gameState = GAME_STATE_POINT_PAUSE;
  requestAnimationFrame(renderEndOfPoint);
  setTimeout(function() { if (gameState === GAME_STATE_POINT_PAUSE) startNextPoint(); }, 700);
}
function startNextPoint() {
  initRound(leftWon); updatesToPaint = 0; updateCount = 0; gameState = GAME_STATE_RUNNING;
}
function endMatch() {
  gameState = GAME_STATE_SHOW_WINNER;
  clearInterval(gameIntervalObject);
  var msg;
  if (onePlayer) {
    if (leftWon) {
      nextSlimeIndex++;
      msg = nextSlimeIndex >= slimeAIs.length
        ? '<h1>You beat everyone!</h1><p>Press space to go again!</p>'
        : '<h1>You won!</h1><p>Press space to continue...</p>';
    } else {
      nextSlimeIndex = 0;
      msg = '<h1>You lost :(</h1><p>Press space to retry...</p>';
    }
  } else {
    msg = '<h1>Player ' + (leftWon ? '1' : '2') + ' Wins!</h1><p>Press space for rematch...</p>';
  }
  menuDiv.innerHTML = '<div style="text-align:center;padding-top:40px;">' + msg + '</div>';
  menuDiv.style.display = 'block'; canvas.style.display = 'none'; showBottomBar();
}
function initRound(server) {
  ball.x = server ? 200 : 800; ball.y = 356; ball.velocityX = 0; ball.velocityY = 0;
  slimeLeft.x  = 200; slimeLeft.y  = 0; slimeLeft.velocityX  = 0; slimeLeft.velocityY  = 0;
  slimeRight.x = 800; slimeRight.y = 0; slimeRight.velocityX = 0; slimeRight.velocityY = 0;
}
function updateWindowSize(w, h) {
  viewWidth = w; viewHeight = h;
  pixelsPerUnitX = w / gameWidth; pixelsPerUnitY = h / gameHeight;
  courtYPix = 4 * viewHeight / 5;
}

// ── lobby websocket ───────────────────────────────────────
var lobbySocket    = null;
var myPlayerName   = '';
var currentLobbies = [];

function connectLobby() {
  var wsUrl = window.SLIME_WS_URL ||
    ((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host);
  try { lobbySocket = new WebSocket(wsUrl); } catch(e) { return; }

  lobbySocket.onmessage = function(e) {
    try { handleServerMessage(JSON.parse(e.data)); } catch(_) {}
  };
  lobbySocket.onclose = function() {
    lobbySocket = null; updatePlayerCount(0);
    if (onlineMode || isSpectator) {
      clearInterval(onlineInputInterval);
      onlineMode = false; isSpectator = false;
      canvas.style.display = 'none';
      menuDiv.style.display = 'block';
      menuDiv.innerHTML = '<div style="text-align:center;padding-top:80px;"><h2>Connection lost</h2></div>';
      hideSpecBadge(); showBottomBar();
      setTimeout(function() { connectLobby(); toInitialMenu(); }, 2000);
    } else {
      setTimeout(connectLobby, 4000);
    }
  };
}

function sendChat() {
  var input = document.getElementById('ChatInput');
  var msg   = (input.value || '').trim();
  if (!msg || !lobbySocket || lobbySocket.readyState !== 1) return;
  lobbySocket.send(JSON.stringify({ type: 'chat', message: msg }));
  input.value = '';
}
function addChatMessage(name, text) {
  var log = document.getElementById('ChatLog');
  if (!log) return;
  var div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = name
    ? '<span class="chat-name">' + name + '</span>: ' + text
    : '<span class="chat-sys">' + text + '</span>';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
}
function updatePlayerCount(n) {
  var el = document.getElementById('PlayerCountNum');
  if (el) el.textContent = n;
}

// ── particles ─────────────────────────────────────────────
var particles = [];
function spawnParticles(x, y, color) {
  for (var i = 0; i < 10; i++) {
    var a = (i / 10) * TWO_PI;
    var sp = 2 + Math.random() * 4;
    particles.push({
      x:x*pixelsPerUnitX, y:courtYPix - y*pixelsPerUnitY,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 2,
      life:1, col:color, r:3+Math.random()*3
    });
  }
}
function tickParticles() {
  particles = particles.filter(function(p) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.06;
    return p.life > 0;
  });
}
function drawParticles() {
  particles.forEach(function(p) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TWO_PI); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ── name tag + streak drawing ─────────────────────────────
function drawOnlineHUD() {
  if (!playerNameLeft || currentRoomId === null) return;
  var now = Date.now();
  ctx.textAlign = 'center';

  function drawTag(slime, name, streak, emote, emoteEnd) {
    var xp = slime.x * pixelsPerUnitX;
    var yp = courtYPix + 8;
    // name pill
    ctx.font = 'bold 10px Courier New';
    var tw = ctx.measureText(name).width + 14;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(xp - tw/2, yp, tw, 14);
    ctx.fillStyle = slime.onLeft ? '#66ffcc' : '#ff66aa';
    ctx.fillText(name, xp, yp + 10);
    // streak
    if (streak >= 2) {
      var sc = streak >= 5 ? '#ff4400' : streak >= 3 ? '#ff9900' : '#ffcc00';
      ctx.font = 'bold 9px Courier New';
      ctx.fillStyle = sc;
      ctx.fillText(streak + 'x STREAK', xp, yp + 23);
    }
    // emote bubble
    if (emote && now < emoteEnd) {
      ctx.font = '20px sans-serif';
      ctx.fillText(emote, xp, courtYPix - slime.y*pixelsPerUnitY - slime.radius*pixelsPerUnitY - 14);
    }
  }

  drawTag(slimeLeft,  playerNameLeft,  leftStreak,  emoteLeft,  emoteLeftEnd);
  drawTag(slimeRight, playerNameRight, rightStreak, emoteRight, emoteRightEnd);

  // rally counter
  if (rallyCount >= 5) {
    ctx.font = 'bold 11px Courier New';
    ctx.fillStyle = rallyCount >= 15 ? '#ff0066' : rallyCount >= 10 ? '#ff6600' : '#ffcc00';
    var rt = 'RALLY ' + rallyCount;
    var rw = ctx.measureText(rt).width + 16;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(viewWidth/2 - rw/2, courtYPix - 36, rw, 16);
    ctx.fillStyle = rallyCount >= 15 ? '#ff0066' : rallyCount >= 10 ? '#ff6600' : '#ffcc00';
    ctx.fillText(rt, viewWidth/2, courtYPix - 24);
  }

  ctx.textAlign = 'left';
}

    html +=
      '<div class="lobby-row" onclick="joinRoom(' + r.id + ')" style="background:' + bgCol + ';border-color:rgba(255,255,255,.12);">' +
        '<span style="font-size:16px;margin-right:2px;">' + MAP_ICONS[r.id] + '</span>' +
        '<span class="lobby-name" style="color:' + txtCol + ';">' + r.name + '</span>' +
        '<span class="lobby-dots" style="color:' + txtCol + ';opacity:.8;">' + dots + '</span>' +
        spec +
        '<span class="lobby-badge ' + badgeClass + '">' + badge + '</span>' +
      '</div>';
  });
  html += '<div class="lobby-back"><span onclick="cancelLobbySelect()" class="SmallButton" style="font-size:12px;color:#aaa;">← back</span></div>';
  html += '</div>';
  menuDiv.innerHTML = html;
}

function joinRoom(roomId) {
  if (!lobbySocket || lobbySocket.readyState !== 1) return;
  showingLobbySelect = false;
  lobbySocket.send(JSON.stringify({ type: 'join_room', roomId: roomId }));
}

function cancelLobbySelect() {
  showingLobbySelect = false;
  showBottomBar(); toInitialMenu();
}

function leaveLobby() {
  showingLobbySelect = false; onlineMode = false; isSpectator = false;
  if (onlineInputInterval) { clearInterval(onlineInputInterval); onlineInputInterval = null; }
  hideSpecBadge(); showLeaveBtn(false);
  if (lobbySocket && lobbySocket.readyState === 1) {
    lobbySocket.send(JSON.stringify({ type: 'leave_room' }));
  }
  showBottomBar(); toInitialMenu();
}

// ── server message handler ────────────────────────────────
function handleServerMessage(msg) {
  if (msg.type === 'connected') {
    myPlayerName   = msg.name;
    currentLobbies = msg.lobbies || [];
    updatePlayerCount(msg.totalPlayers);
    var nd = document.getElementById('PlayerNameDisplay');
    if (nd) nd.textContent = msg.name;
    addChatMessage(null, 'Connected as ' + msg.name);

  } else if (msg.type === 'lobby_list') {
    currentLobbies = msg.lobbies || [];
    updatePlayerCount(msg.totalPlayers);
    if (showingLobbySelect) renderLobbySelect(currentLobbies);

  } else if (msg.type === 'chat') {
    addChatMessage(msg.name, msg.message);

  } else if (msg.type === 'player_count') {
    updatePlayerCount(msg.count);

  } else if (msg.type === 'room_joined') {
    currentRoomId = msg.roomId;
    showLeaveBtn(true);
    if (msg.role === 'spectator') {
      isSpectator = true; onlineMode = false;
      canvas.style.display = 'none'; menuDiv.style.display = 'block';
      menuDiv.innerHTML =
        '<div style="text-align:center;padding-top:80px;">' +
        '<div style="font-size:32px;margin-bottom:12px;">👁</div>' +
        '<div style="color:#00ffcc;letter-spacing:4px;font-size:13px;margin-bottom:8px;">SPECTATING</div>' +
        '<div style="color:#444;font-size:11px;letter-spacing:1px;">Waiting for game to start...</div>' +
        '</div>';
    } else {
      onlineMode = true; mySide = msg.side; onlinePointText = null; isSpectator = false;
      if (onlineInputInterval) { clearInterval(onlineInputInterval); onlineInputInterval = null; }
      canvas.style.display = 'none'; menuDiv.style.display = 'block';
      var col = msg.side === 'left' ? '#66ffcc' : '#ff66aa';
      menuDiv.innerHTML =
        '<div style="text-align:center;padding-top:70px;">' +
        '<div style="color:#00ffcc;letter-spacing:4px;font-size:13px;margin-bottom:14px;">READY TO FIGHT</div>' +
        '<div style="font-size:38px;margin-bottom:10px;">' + (msg.side === 'left' ? '🟢' : '🔴') + '</div>' +
        '<div style="color:' + col + ';font-size:11px;letter-spacing:2px;margin-bottom:24px;">YOU ARE ' + msg.side.toUpperCase() + '</div>' +
        '<div style="color:#333;font-size:10px;letter-spacing:1px;">Waiting for opponent...</div>' +
        '</div>';
    }

  } else if (msg.type === 'start') {
    mySide = msg.side;
    playerNameLeft  = msg.nameLeft  || 'Player 1';
    playerNameRight = msg.nameRight || 'Player 2';
    leftStreak = 0; rightStreak = 0; rallyCount = 0;
    launchOnlineGame();

  } else if (msg.type === 'game_started') {
    playerNameLeft  = msg.nameLeft  || 'Player 1';
    playerNameRight = msg.nameRight || 'Player 2';
    leftStreak = 0; rightStreak = 0; rallyCount = 0;
    launchSpectatorMode();

  } else if (msg.type === 'spectator_waiting') {
    // already showing spectator waiting screen

  } else if (msg.type === 'state') {
    // track rally from ball crossing net
    var prevRally = rallyCount;
    if (ball && msg.ball) {
      var crossed = (ball.x < 500 && msg.ball.x >= 500) || (ball.x >= 500 && msg.ball.x < 500);
      if (crossed) rallyCount++;
    }
    applyServerState(msg);

  } else if (msg.type === 'point') {
    rallyCount = 0;
    shakeFrames = 8; shakeAmt = 5;
    if (msg.scorer === 'left') {
      leftStreak++; rightStreak = 0;
      spawnParticles(slimeLeft.x, slimeLeft.y + 80, '#66ffcc');
    } else {
      rightStreak++; leftStreak = 0;
      spawnParticles(slimeRight.x, slimeRight.y + 80, '#ff66aa');
    }
    if (!isSpectator) {
      onlinePointText = (mySide === msg.scorer) ? 'YOU SCORED' : 'OPPONENT SCORES';
    } else {
      onlinePointText = (msg.scorer === 'left' ? playerNameLeft : playerNameRight) + ' SCORES';
    }
    setTimeout(function() { onlinePointText = null; }, 700);

  } else if (msg.type === 'emote') {
    var now = Date.now();
    if (msg.side === 'left')  { emoteLeft  = msg.emoji; emoteLeftEnd  = now + 2200; }
    else                      { emoteRight = msg.emoji; emoteRightEnd = now + 2200; }

  } else if (msg.type === 'game_over') {
    showLeaveBtn(false);
    if (isSpectator) {
      finishSpectating(msg.winner);
    } else {
      finishOnlineGame(msg.winner);
    }

  } else if (msg.type === 'opponent_disconnected') {
    clearInterval(onlineInputInterval); onlineInputInterval = null;
    onlineMode = false; isSpectator = false;
    showLeaveBtn(false);
    hideSpecBadge(); canvas.style.display = 'none';
    menuDiv.style.display = 'none'; showBottomBar(); toInitialMenu();
    addChatMessage(null, 'Opponent disconnected.');
  }
}

// ── online game (player) ──────────────────────────────────
function launchOnlineGame() {
  slimeLeft  = newLegacySlime(true,  100, '#0f0');
  slimeRight = newLegacySlime(false, 100, '#f00');
  ball       = newLegacyBall(25, '#ff0');
  slimeLeftScore = 0; slimeRightScore = 0;
  slimeLeft.img = greenSlimeImage; slimeRight.img = redSlimeImage;
  legacyGraphics = false;
  canvas.style.display = 'block'; menuDiv.style.display = 'none';

  onlineInputInterval = setInterval(function() {
    if (!lobbySocket || lobbySocket.readyState !== 1) return;
    var lk = mySide === 'left' ? KEY_A    : KEY_LEFT;
    var rk = mySide === 'left' ? KEY_D    : KEY_RIGHT;
    var uk = mySide === 'left' ? KEY_W    : KEY_UP;
    var mv = 0;
    if (keysDown[lk] && !keysDown[rk]) mv = 1;
    else if (keysDown[rk] && !keysDown[lk]) mv = 2;
    // number keys 1-4 send emotes
    [49,50,51,52].forEach(function(k,i) {
      if (keysDown[k]) { sendEmote(i); keysDown[k] = false; }
    });
    lobbySocket.send(JSON.stringify({ movement: mv, jump: !!keysDown[uk] }));
  }, 20);
}

// ── spectator mode ────────────────────────────────────────
function launchSpectatorMode() {
  slimeLeft  = newLegacySlime(true,  100, '#0f0');
  slimeRight = newLegacySlime(false, 100, '#f00');
  ball       = newLegacyBall(25, '#ff0');
  slimeLeft.img = greenSlimeImage; slimeRight.img = redSlimeImage;
  legacyGraphics = false;
  canvas.style.display = 'block'; menuDiv.style.display = 'none';
  showSpecBadge();
}

function applyServerState(msg) {
  if (isSpectator && canvas.style.display !== 'block') launchSpectatorMode();

  var prevBallX = ball ? ball.x : msg.ball.x;
  ball.x = msg.ball.x; ball.y = msg.ball.y; ball.velocityX = msg.ball.velocityX;
  slimeLeft.x  = msg.slimeLeft.x;  slimeLeft.y  = msg.slimeLeft.y;
  slimeRight.x = msg.slimeRight.x; slimeRight.y = msg.slimeRight.y;
  slimeLeftScore = msg.scoreLeft; slimeRightScore = msg.scoreRight;

  tickParticles();

  // screen shake offset
  var sx = 0, sy = 0;
  if (shakeFrames > 0) {
    sx = (Math.random()-.5)*shakeAmt*2; sy = (Math.random()-.5)*shakeAmt*2;
    shakeFrames--;
  }
  if (sx || sy) { ctx.save(); ctx.translate(sx, sy); }
  renderBackground();
  ball.render(); slimeLeft.render(); slimeRight.render();
  drawParticles();
  drawOnlineHUD();
  if (sx || sy) ctx.restore();

  if (onlinePointText) {
    ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(viewWidth/2-90, courtYPix+8, 180, 22);
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(onlinePointText, viewWidth/2, courtYPix+23);
    ctx.textAlign = 'left';
  }
}

function finishOnlineGame(winner) {
  clearInterval(onlineInputInterval); onlineInputInterval = null;
  onlineMode = false; showLeaveBtn(false); particles = [];
  var iWon = (mySide === winner);
  if (iWon) sessionWins++; else sessionLosses++;
  var wName = winner === 'left' ? playerNameLeft : playerNameRight;
  var lName = winner === 'left' ? playerNameRight : playerNameLeft;
  var col   = iWon ? '#66ffcc' : '#ff66aa';
  canvas.style.display = 'none'; menuDiv.style.display = 'block';
  menuDiv.innerHTML =
    '<div style="text-align:center;padding-top:42px;background:#05000f;height:100%;position:relative;">' +
    '<div style="font-size:11px;color:#444;letter-spacing:3px;margin-bottom:10px;">MATCH OVER</div>' +
    '<div style="font-size:44px;font-weight:bold;color:' + col + ';letter-spacing:3px;' +
    'text-shadow:0 0 24px ' + col + ';margin-bottom:6px;">' + (iWon ? 'VICTORY' : 'DEFEAT') + '</div>' +
    '<div style="font-size:11px;color:#555;letter-spacing:2px;margin-bottom:20px;">' + wName + ' defeats ' + lName + '</div>' +
    '<div style="font-size:10px;color:#333;letter-spacing:2px;margin-bottom:22px;">' +
    'SESSION &nbsp; <span style="color:#66ffcc;">' + sessionWins + 'W</span> / <span style="color:#ff66aa;">' + sessionLosses + 'L</span></div>' +
    '<span onclick="showLobbySelect()" class="btn" style="margin:6px 10px;">PLAY AGAIN</span>' +
    '<span onclick="toInitialMenu()" class="btn pink" style="margin:6px 10px;">MENU</span>' +
    '</div>';
  showBottomBar();
}

function finishSpectating(winner) {
  isSpectator = false; hideSpecBadge(); showLeaveBtn(false); particles = [];
  var wName = winner === 'left' ? playerNameLeft : playerNameRight;
  canvas.style.display = 'none'; menuDiv.style.display = 'block';
  menuDiv.innerHTML =
    '<div style="text-align:center;padding-top:60px;background:#05000f;height:100%;">' +
    '<div style="font-size:10px;color:#444;letter-spacing:3px;margin-bottom:10px;">MATCH OVER</div>' +
    '<div style="font-size:36px;font-weight:bold;color:#00ffcc;letter-spacing:2px;' +
    'text-shadow:0 0 20px rgba(0,255,200,.7);margin-bottom:8px;">' + wName + '</div>' +
    '<div style="font-size:11px;color:#555;letter-spacing:3px;margin-bottom:28px;">WINS THE MATCH</div>' +
    '<span onclick="showLobbySelect()" class="btn" style="margin:6px 10px;">BACK TO LOBBIES</span>' +
    '</div>';
  showBottomBar();
}

// ── space key ─────────────────────────────────────────────
function spaceKeyDown() {
  if (onlineMode || isSpectator || showingLobbySelect) return;
  if (gameState === GAME_STATE_SHOW_WINNER) {
    if (onePlayer && nextSlimeIndex >= slimeAIs.length) {
      nextSlimeIndex = 0; toInitialMenu();
    } else {
      start(onePlayer);
    }
  }
}

// ── local game start ──────────────────────────────────────
function start(startAsOnePlayer) {
  currentRoomId = null;
  onePlayer = startAsOnePlayer;
  slimeLeftScore = 0; slimeRightScore = 0;
  slimeLeft.img = greenSlimeImage;
  if (onePlayer) {
    var p = slimeAIs[nextSlimeIndex];
    slimeRight.color = p.color; legacySkyColor = p.legacySkyColor;
    backImage = backImages[p.backImageName]; backTextColor = p.backTextColor;
    legacyGroundColor = p.legacyGroundColor; legacyBallColor = p.legacyBallColor;
    newGroundColor = p.newGroundColor; slimeRight.img = null;
    slimeAI = newSlimeAI(false, p.name); p.initAI(slimeAI);
  } else {
    legacySkyColor = '#00f'; backImage = backImages['sky'];
    backTextColor = '#000'; legacyGroundColor = '#888';
    legacyBallColor = '#fff'; newGroundColor = '#ca6';
    slimeRight.img = redSlimeImage; slimeAI = null;
  }
  initRound(true); updatesToPaint = 0; updateCount = 0;
  loadOptions(); gameState = GAME_STATE_RUNNING;
  renderBackground();
  canvas.style.display = 'block'; menuDiv.style.display = 'none'; hideBottomBar();
  gameIntervalObject = setInterval(gameIteration, 20);
}

function toInitialMenu() {
  onlineMode = false; isSpectator = false; showingLobbySelect = false; currentRoomId = null;
  hideSpecBadge(); showLeaveBtn(false); particles = [];
  canvas.style.display = 'none'; menuDiv.style.display = 'block';
  menuDiv.innerHTML =
    '<div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;' +
    'align-items:center;justify-content:center;background:#05000f;overflow:hidden;">' +
    // grid lines
    '<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,200,.03) 1px,transparent 1px),' +
    'linear-gradient(90deg,rgba(0,255,200,.03) 1px,transparent 1px);background-size:30px 30px;"></div>' +
    // title
    '<div style="position:relative;font-size:54px;font-weight:bold;color:#00ffcc;letter-spacing:6px;' +
    'text-shadow:0 0 30px rgba(0,255,200,.8),0 0 60px rgba(0,255,200,.3);margin-bottom:4px;">SLIME</div>' +
    '<div style="position:relative;font-size:11px;color:#ff00cc;letter-spacing:10px;text-transform:uppercase;' +
    'text-shadow:0 0 12px rgba(255,0,204,.6);margin-bottom:28px;">VOLLEYBALL</div>' +
    // session stats
    (sessionWins + sessionLosses > 0
      ? '<div style="position:relative;font-size:10px;color:#444;letter-spacing:2px;margin-bottom:10px;">' +
        'SESSION: <span style="color:#66ffcc;">' + sessionWins + 'W</span> / ' +
        '<span style="color:#ff66aa;">' + sessionLosses + 'L</span></div>'
      : '') +
    '<div style="position:relative;font-size:10px;color:rgba(0,255,200,.25);letter-spacing:4px;text-transform:uppercase;">' +
    'Use keys 1-4 during game for emotes</div>' +
    '<div style="position:absolute;bottom:12px;font-size:9px;color:#222;letter-spacing:3px;text-transform:uppercase;">Quick Play to start</div>' +
    '</div>';
  showBottomBar();
}

function loadOptions() {
  legacyGraphics = document.getElementById('LegacyGraphics').checked;
  slowMotion     = document.getElementById('SlowMotion').checked;
  physicsLog     = document.getElementById('PhysicsLog').checked ? 120 : 0;
}
function showOptions() {
  if (gameState === GAME_STATE_RUNNING)      gameState = GAME_STATE_MENU_PAUSE;
  else if (gameState === GAME_STATE_POINT_PAUSE) gameState = GAME_STATE_MENU_PAUSE_BETWEEN_POINTS;
  document.getElementById('OptionsDiv').style.display = 'block';
}
function hideOptions() {
  document.getElementById('OptionsDiv').style.display = 'none';
  if (gameState === GAME_STATE_MENU_PAUSE) { updateCount = 0; gameState = GAME_STATE_RUNNING; }
  else if (gameState === GAME_STATE_MENU_PAUSE_BETWEEN_POINTS) startNextPoint();
  loadOptions();
}

// ── init ──────────────────────────────────────────────────
function bodyload() {
  var contentDiv = document.getElementById('GameContentDiv');

  canvas = document.createElement('canvas');
  canvas.width = 750; canvas.height = 375;
  canvas.style.position = 'absolute'; canvas.style.left = '0'; canvas.style.top = '0';
  canvas.style.display = 'none';
  ctx = canvas.getContext('2d'); ctx.font = '20px Georgia';
  contentDiv.appendChild(canvas);

  gameWidth = 1000; gameHeight = 1000;
  updateWindowSize(canvas.width, canvas.height);

  menuDiv = document.createElement('div');
  menuDiv.style.position = 'absolute'; menuDiv.style.left = '0'; menuDiv.style.top = '0';
  menuDiv.style.width = '750px'; menuDiv.style.height = '375px';
  menuDiv.style.background = '#05000f';
  contentDiv.appendChild(menuDiv);

  logString = ''; nextSlimeIndex = 0;
  ball       = newLegacyBall(25, '#ff0');
  slimeLeft  = newLegacySlime(true,  100, '#0f0');
  slimeRight = newLegacySlime(false, 100, '#f00');

  ['sky2.jpg','cave.jpg','sunset.jpg'].forEach(function(src) {
    var img = new Image(); img.src = src;
    img.onload = function() {
      backImages[src.replace('.jpg','')] = this;
      if (src === 'sky2.jpg') backImages['sky'] = this;
    };
  });
  var bi = new Image(); bi.src = 'vball.png'; bi.onload = function() { ballImage = this; };
  greenSlimeImage = new Image(); greenSlimeImage.src = 'slime175green.png';
  redSlimeImage   = new Image(); redSlimeImage.src   = 'slime175red.png';

  toInitialMenu();
  connectLobby();
}

</script>
</head><body onload="bodyload()">

<div id="LobbyWrapper">

    <span style="color:rgba(0,255,200,.25);font-size:9px;letter-spacing:1px;">KEYS 1-4 EMOTES</span>
  </div>

        <div style="color:#00ffcc;letter-spacing:3px;font-size:12px;margin-bottom:12px;text-transform:uppercase;">Options</div>

    <button id="OptionsBtn" onclick="showOptions()">[ OPTIONS ]</button>
  </div>

</div>
