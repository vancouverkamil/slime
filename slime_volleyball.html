<style type="text/css">

  background: #0d0d1a;
  display: flex;

/* ── existing game UI helpers ── */

h2 { margin: 8px 0; }
.SmallButton { text-decoration:none; cursor:pointer; color:#555; }

  background: #3498db;
  background-image: linear-gradient(to bottom, #3498db, #2980b9);
  border-radius: 15px;

input[type='checkbox'] { margin-right: 1em; }

</style>
<script type="text/javascript" src="Input.js"></script>
<script type="text/javascript" src="SlimeAI.js"></script>
<script type="text/javascript">

var physicsLog = 0;
var TWO_PI = Math.PI*2;
var WIN_AMOUNT = 7;

function newLegacyBall(radius,color) {
  return {
    radius:radius, color:color, x:0, y:0, velocityX:0, velocityY:0, rotation:0,
    render: function() {
      var xPix   = this.x * pixelsPerUnitX;
      var yPix   = courtYPix - (this.y * pixelsPerUnitY);
      var radiusPix = this.radius * pixelsPerUnitY + 2;
      if(ballImage && !legacyGraphics) {
        this.rotation += this.velocityX / 100;
        this.rotation = this.rotation % TWO_PI;
        ctx.translate(xPix, yPix);
        ctx.rotate(this.rotation);
        ctx.drawImage(ballImage, -radiusPix, -radiusPix);
        ctx.setTransform(1,0,0,1,0,0);
      } else {
        ctx.fillStyle = legacyBallColor;
        ctx.beginPath();
        ctx.arc(xPix, yPix, radiusPix, 0, TWO_PI);
        ctx.fill();
      }
    }
  };
}

function newLegacySlime(onLeft,radius,color) {
  return {
    onLeft:onLeft, radius:radius, color:color, img:null, x:0, y:0, velocityX:0, velocityY:0,
    render: function() {
      var xPix      = this.x * pixelsPerUnitX;
      var yPix      = courtYPix - (this.y * pixelsPerUnitY);
      var radiusPix = this.radius * pixelsPerUnitY;
      if(this.img && !legacyGraphics) {
        ctx.drawImage(this.img, xPix - radiusPix, yPix - 38);
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(xPix, yPix, radiusPix, Math.PI, TWO_PI);
        ctx.fill();
      }
      var eyeX = this.x + (this.onLeft ? 1 : -1)*this.radius/4;
      var eyeY = this.y + this.radius/2;
      var eyeXPix = eyeX * pixelsPerUnitX;
      var eyeYPix = courtYPix - (eyeY * pixelsPerUnitY);
      ctx.translate(eyeXPix, eyeYPix);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0,0, radiusPix/4, 0, TWO_PI);
      ctx.fill();
      var dx = ball.x - eyeX;
      var dy = eyeY - ball.y;
      var dist = Math.sqrt(dx*dx+dy*dy);
      var rPixOver8 = radiusPix/8;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(rPixOver8*dx/dist, rPixOver8*dy/dist, rPixOver8, 0, TWO_PI);
      ctx.fill();
      ctx.setTransform(1,0,0,1,0,0);
    }
  };
}

var GAME_STATE_RUNNING                   = 1;
var GAME_STATE_POINT_PAUSE               = 2;
var GAME_STATE_MENU_PAUSE                = 3;
var GAME_STATE_MENU_PAUSE_BETWEEN_POINTS = 4;
var GAME_STATE_SHOW_WINNER               = 5;

var menuDiv, smallMenuDiv, onePlayer, nextSlimeIndex, gameState;
var ctx, canvas, viewWidth, viewHeight, courtYPix, pixelsPerUnitX, pixelsPerUnitY;
var updatesToPaint, legacySkyColor, legacyGroundColor, legacyBallColor, newGroundColor;
var backImage, backTextColor, backImages = {}, ballImage, gameIntervalObject, endOfPointText;
var greenSlimeImage, redSlimeImage, legacyGraphics;
var gameWidth, gameHeight, ball, slimeLeft, slimeRight, slimeLeftScore, slimeRightScore;
var slimeAI, updateCount, leftWon, slowMotion;
var logString;
function log(msg) { logString += msg + '\n'; }

function updateSlimeVelocities(s,movement,jump) {
  if(movement == 0)      s.velocityX = 0;
  else if(movement == 1) s.velocityX = -8;
  else if(movement == 2) s.velocityX =  8;
  else throw "slime movement " + movement + " is invalid";
  if(jump && s.y == 0) s.velocityY = 31;
}
function updateSlimeVelocitiesWithKeys(s,left,right,up) {
  if(keysDown[left]) {
    s.velocityX = keysDown[right] ? 0 : -8;
  } else if(keysDown[right]) {
    s.velocityX = 8;
  } else {
    s.velocityX = 0;
  }
  if(s.y == 0 && keysDown[up]) s.velocityY = 31;
}
function updateSlimeVelocitiesWithDoubleKeys(s,left1,left2,right1,right2,up1,up2) {
  if(keysDown[left1] || keysDown[left2]) {
    s.velocityX = (keysDown[right1] || keysDown[right2]) ? 0 : -8;
  } else if(keysDown[right1] || keysDown[right2]) {
    s.velocityX = 8;
  } else {
    s.velocityX = 0;
  }
  if(s.y == 0 && (keysDown[up1] || keysDown[up2])) s.velocityY = 31;
}
function updateSlime(s, leftLimit, rightLimit) {
  if(s.velocityX != 0) {
    s.x += s.velocityX;
    if(s.x < leftLimit) s.x = leftLimit;
    else if(s.x > rightLimit) s.x = rightLimit;
  }
  if(s.velocityY != 0 || s.y > 0) {
    s.velocityY -= 2;
    s.y += s.velocityY;
    if(s.y < 0) { s.y = 0; s.velocityY = 0; }
  }
}

var MAX_VELOCITY_X = 15;
var MAX_VELOCITY_Y = 22;
function collisionBallSlime(s) {
  var dx = 2 * (ball.x - s.x);
  var dy = ball.y - s.y;
  var dist = Math.trunc(Math.sqrt(dx * dx + dy * dy));
  var dVelocityX = ball.velocityX - s.velocityX;
  var dVelocityY = ball.velocityY - s.velocityY;
  if(dy > 0 && dist < ball.radius + s.radius && dist > FUDGE) {
    ball.x = s.x + Math.trunc(Math.trunc((s.radius + ball.radius) / 2) * dx / dist);
    ball.y = s.y + Math.trunc((s.radius + ball.radius) * dy / dist);
    var something = Math.trunc((dx * dVelocityX + dy * dVelocityY) / dist);
    if(something <= 0) {
      ball.velocityX += Math.trunc(s.velocityX - 2 * dx * something / dist);
      ball.velocityY += Math.trunc(s.velocityY - 2 * dy * something / dist);
      if(ball.velocityX < -MAX_VELOCITY_X) ball.velocityX = -MAX_VELOCITY_X;
      else if(ball.velocityX > MAX_VELOCITY_X) ball.velocityX = MAX_VELOCITY_X;
      if(ball.velocityY < -MAX_VELOCITY_Y) ball.velocityY = -MAX_VELOCITY_Y;
      else if(ball.velocityY > MAX_VELOCITY_Y) ball.velocityY = MAX_VELOCITY_Y;
    }
  }
}
var FUDGE = 5;
function updateBall() {
  ball.velocityY += -1;
  if(ball.velocityY < -MAX_VELOCITY_Y) ball.velocityY = -MAX_VELOCITY_Y;
  ball.x += ball.velocityX;
  ball.y += ball.velocityY;
  collisionBallSlime(slimeLeft);
  collisionBallSlime(slimeRight);
  if(ball.x < 15)  { ball.x = 15;  ball.velocityX = -ball.velocityX; }
  else if(ball.x > 985) { ball.x = 985; ball.velocityX = -ball.velocityX; }
  if(ball.x > 480 && ball.x < 520 && ball.y < 140) {
    if(ball.velocityY < 0 && ball.y > 130) {
      ball.velocityY *= -1; ball.y = 130;
    } else if(ball.x < 500) {
      ball.x = 480;
      ball.velocityX = ball.velocityX >= 0 ? -ball.velocityX : ball.velocityX;
    } else {
      ball.x = 520;
      ball.velocityX = ball.velocityX <= 0 ? -ball.velocityX : ball.velocityX;
    }
  }
  if(ball.y < 0) {
    if(ball.x > 500) { leftWon = true;  slimeLeftScore++;  }
    else             { leftWon = false; slimeRightScore++; }
    endPoint();
    return true;
  }
  return false;
}
function updateFrame() {
  if(onePlayer) {
    slimeAI.move(false);
    updateSlimeVelocitiesWithDoubleKeys(slimeLeft, KEY_A,KEY_LEFT, KEY_D,KEY_RIGHT, KEY_W,KEY_UP);
    updateSlimeVelocities(slimeRight, slimeAI.movement, slimeAI.jumpSet);
  } else {
    updateSlimeVelocitiesWithKeys(slimeLeft,  KEY_A,    KEY_D,     KEY_W);
    updateSlimeVelocitiesWithKeys(slimeRight, KEY_LEFT, KEY_RIGHT, KEY_UP);
  }
  updateSlime(slimeLeft,  50,  445);
  updateSlime(slimeRight, 555, 950);
  updateBall();
}

function renderPoints(score, initialX, xDiff) {
  ctx.fillStyle = '#ff0';
  var x = initialX;
  for(var i = 0; i < score; i++) {
    ctx.beginPath(); ctx.arc(x, 25, 12, 0, TWO_PI); ctx.fill();
    x += xDiff;
  }
  ctx.strokeStyle = backTextColor;
  ctx.lineWidth = 2;
  x = initialX;
  for(var i = 0; i < WIN_AMOUNT; i++) {
    ctx.beginPath(); ctx.arc(x, 25, 12, 0, TWO_PI); ctx.stroke();
    x += xDiff;
  }
}
function renderBackground() {
  if(legacyGraphics) {
    ctx.fillStyle = legacySkyColor;
    ctx.fillRect(0, 0, viewWidth, courtYPix);
    ctx.fillStyle = legacyGroundColor;
  } else {
    ctx.drawImage(backImage, 0, 0);
    ctx.fillStyle = newGroundColor;
  }
  ctx.fillRect(0, courtYPix, viewWidth, viewHeight - courtYPix);
  ctx.fillStyle = '#fff';
  ctx.fillRect(viewWidth/2-2, 7*viewHeight/10, 4, viewHeight/10+5);
  renderPoints(slimeLeftScore,  30,            40);
  renderPoints(slimeRightScore, viewWidth - 30, -40);
}
function renderGame() {
  if(updatesToPaint == 0) {
    console.log("ERROR: render called but not ready to paint");
  } else {
    if(updatesToPaint > 1) console.log("WARNING: render missed " + (updatesToPaint - 1) + " frame(s)");
    renderBackground();
    ball.render(); slimeLeft.render(); slimeRight.render();
    updatesToPaint = 0;
  }
}
function renderEndOfPoint() {
  var textWidth = ctx.measureText(endOfPointText).width;
  renderGame();
  ctx.fillStyle = '#000';
  ctx.fillText(endOfPointText, (viewWidth - textWidth)/2, courtYPix + (viewHeight - courtYPix)/2);
}

function gameIteration() {
  if(gameState == GAME_STATE_RUNNING) {
    updateCount++;
    if(slowMotion && (updateCount % 2) == 0) return;
    if(updatesToPaint > 0) console.log("WARNING: updating frame before it was rendered");
    if(physicsLog > 0) {
      log("Frame");
      log(" ball.x  " + ball.x); log(" ball.y  " + ball.y);
      log(" ball.vx " + ball.velocityX); log(" ball.vy " + ball.velocityY);
      physicsLog--;
      if(physicsLog == 0) {
        var logDom = document.createElement('pre');
        logDom.innerHTML = logString;
        document.body.appendChild(logDom);
      }
    }
    updateFrame();
    updatesToPaint++;
    if(updatesToPaint == 1) requestAnimationFrame(renderGame);
  }
}

// ── bottom bar helpers ──
function showBottomBar() {
  var bb = document.getElementById('BottomBar');
  if(bb) bb.style.display = 'flex';
}
function hideBottomBar() {
  var bb = document.getElementById('BottomBar');
  if(bb) bb.style.display = 'none';
}

// ── lobby WebSocket ──
var lobbySocket  = null;
var myPlayerName = '';

function connectLobby() {
  var wsUrl = window.SLIME_WS_URL ||
    ((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host);
  try {
    lobbySocket = new WebSocket(wsUrl);
  } catch(e) { return; }

  lobbySocket.onmessage = function(e) {
    try { handleServerMessage(JSON.parse(e.data)); } catch(_) {}
  };
  lobbySocket.onclose = function() {
    lobbySocket = null;
    updatePlayerCount(0);
    if(onlineMode) {
      clearInterval(onlineInputInterval);
      onlineMode = false;
      canvas.style.display = 'none';
      menuDiv.style.display = 'block';
      menuDiv.innerHTML = '<div style="text-align:center;padding-top:80px;"><h2>Connection lost</h2></div>';
      showBottomBar();
      setTimeout(function() { connectLobby(); toInitialMenu(); }, 2000);
    } else {
      setTimeout(connectLobby, 4000);
    }
  };
}

function sendChat() {
  var input = document.getElementById('ChatInput');
  var msg   = (input.value || '').trim();
  if(!msg) return;
  if(lobbySocket && lobbySocket.readyState === 1) {
    lobbySocket.send(JSON.stringify({ type: 'chat', message: msg }));
  }
  input.value = '';
}

function addChatMessage(name, text) {
  var log = document.getElementById('ChatLog');
  if(!log) return;
  var div = document.createElement('div');
  div.className = 'chat-msg';
  if(name) {
    div.innerHTML = '<span class="chat-name">' + name + '</span>: ' + text;
  } else {
    div.innerHTML = '<span class="chat-sys">' + text + '</span>';
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  while(log.children.length > 100) log.removeChild(log.firstChild);
}

function updatePlayerCount(count) {
  var el = document.getElementById('PlayerCountDiv');
  if(el) el.textContent = '● ' + count + ' player' + (count === 1 ? '' : 's') + ' online';
}

// ── online mode state ──
var onlineMode         = false;
var mySide             = null;
var onlineInputInterval = null;
var onlinePointText    = null;

function startOnline() {
  if(!lobbySocket || lobbySocket.readyState !== 1) {
    addChatMessage(null, 'Still connecting to server...');
    return;
  }
  if(onlineInputInterval) { clearInterval(onlineInputInterval); onlineInputInterval = null; }
  onlineMode = true; mySide = null; onlinePointText = null;
  hideBottomBar();
  canvas.style.display = 'none';
  menuDiv.style.display = 'block';
  menuDiv.innerHTML =
    '<div style="text-align:center;padding-top:70px;">' +
    '<h2 style="font-size:32px;margin-bottom:16px;">Finding opponent...</h2>' +
    '<p style="color:#555;">Waiting in queue</p>' +
    '<br/><span onclick="cancelQueue()" class="SmallButton" style="font-size:13px;">cancel</span>' +
    '</div>';
  lobbySocket.send(JSON.stringify({ type: 'queue' }));
}

function cancelQueue() {
  onlineMode = false;
  if(lobbySocket && lobbySocket.readyState === 1) {
    lobbySocket.send(JSON.stringify({ type: 'cancel_queue' }));
  }
  showBottomBar();
  toInitialMenu();
}

function handleServerMessage(msg) {
  if(msg.type === 'connected') {
    myPlayerName = msg.name;
    updatePlayerCount(msg.playerCount);
    addChatMessage(null, 'Connected as ' + msg.name);
  } else if(msg.type === 'player_count') {
    updatePlayerCount(msg.count);
  } else if(msg.type === 'chat') {
    addChatMessage(msg.name, msg.message);
  } else if(msg.type === 'waiting') {
    // waiting screen already shown in startOnline()
  } else if(msg.type === 'start') {
    mySide = msg.side;
    launchOnlineGame();
  } else if(msg.type === 'state') {
    applyServerState(msg);
  } else if(msg.type === 'point') {
    var iScored = (mySide === msg.scorer);
    onlinePointText = iScored ? 'You scored!' : 'Opponent scores!';
    setTimeout(function() { onlinePointText = null; }, 700);
  } else if(msg.type === 'game_over') {
    finishOnlineGame(msg.winner);
  } else if(msg.type === 'opponent_disconnected') {
    clearInterval(onlineInputInterval);
    onlineMode = false;
    canvas.style.display = 'none';
    menuDiv.style.display = 'none';
    showBottomBar();
    toInitialMenu();
    addChatMessage(null, 'Opponent disconnected.');
  }
}

function launchOnlineGame() {
  slimeLeft  = newLegacySlime(true,  100, '#0f0');
  slimeRight = newLegacySlime(false, 100, '#f00');
  ball       = newLegacyBall(25, '#ff0');
  slimeLeftScore = 0; slimeRightScore = 0;
  slimeLeft.img  = greenSlimeImage;
  slimeRight.img = redSlimeImage;
  legacyGraphics = false;
  legacySkyColor = '#00f'; backImage = backImages['sky'];
  backTextColor = '#000'; legacyGroundColor = '#888';
  legacyBallColor = '#fff'; newGroundColor = '#ca6';
  canvas.style.display = 'block';
  menuDiv.style.display = 'none';

  onlineInputInterval = setInterval(function() {
    if(!lobbySocket || lobbySocket.readyState !== 1) return;
    var leftKey, rightKey, upKey;
    if(mySide === 'left') { leftKey = KEY_A; rightKey = KEY_D; upKey = KEY_W; }
    else                  { leftKey = KEY_LEFT; rightKey = KEY_RIGHT; upKey = KEY_UP; }
    var movement = 0;
    if(keysDown[leftKey]  && !keysDown[rightKey]) movement = 1;
    else if(keysDown[rightKey] && !keysDown[leftKey]) movement = 2;
    lobbySocket.send(JSON.stringify({ movement: movement, jump: !!keysDown[upKey] }));
  }, 20);
}

function applyServerState(msg) {
  ball.x = msg.ball.x; ball.y = msg.ball.y; ball.velocityX = msg.ball.velocityX;
  slimeLeft.x  = msg.slimeLeft.x;  slimeLeft.y  = msg.slimeLeft.y;
  slimeRight.x = msg.slimeRight.x; slimeRight.y = msg.slimeRight.y;
  slimeLeftScore = msg.scoreLeft; slimeRightScore = msg.scoreRight;
  renderBackground();
  ball.render(); slimeLeft.render(); slimeRight.render();
  if(onlinePointText) {
    ctx.font = '20px Georgia';
    ctx.fillStyle = '#000';
    var w = ctx.measureText(onlinePointText).width;
    ctx.fillText(onlinePointText, (viewWidth - w)/2, courtYPix + (viewHeight - courtYPix)/2);
  }
}

function finishOnlineGame(winner) {
  clearInterval(onlineInputInterval);
  onlineMode = false;
  var iWon = (mySide === winner);
  canvas.style.display = 'none';
  menuDiv.style.display = 'block';
  menuDiv.innerHTML =
    '<div style="text-align:center;padding-top:50px;">' +
    '<h1 style="font-size:52px;margin-bottom:16px;">' + (iWon ? 'You won!' : 'You lost :(') + '</h1>' +
    '<span onclick="startOnline()" class="btn" style="display:inline-block;margin:10px 12px;font-size:24px;">Play Again</span>' +
    '<span onclick="toInitialMenu()" class="btn" style="display:inline-block;margin:10px 12px;font-size:24px;">Menu</span>' +
    '</div>';
  showBottomBar();
}

function spaceKeyDown() {
  if(onlineMode) return;
  if(gameState == GAME_STATE_SHOW_WINNER) {
    if(onePlayer && nextSlimeIndex >= slimeAIs.length) {
      nextSlimeIndex = 0;
      toInitialMenu();
    } else {
      start(onePlayer);
    }
  }
}

function endMatch() {
  gameState = GAME_STATE_SHOW_WINNER;
  clearInterval(gameIntervalObject);
  if(onePlayer) {
    if(leftWon) {
      nextSlimeIndex++;
      if(nextSlimeIndex >= slimeAIs.length) {
        menuDiv.innerHTML =
          '<div style="text-align:center;padding-top:40px;">' +
          '<h1 style="font-size:52px;margin-bottom:10px;">You beat everyone!</h1>' +
          "Press 'space' to do it all over again!</div>";
      } else {
        menuDiv.innerHTML =
          '<div style="text-align:center;padding-top:40px;">' +
          '<h1 style="font-size:52px;margin-bottom:10px;">You won!</h1>' +
          "Press 'space' to continue...</div>";
      }
    } else {
      nextSlimeIndex = 0;
      menuDiv.innerHTML =
        '<div style="text-align:center;padding-top:40px;">' +
        '<h1 style="font-size:52px;margin-bottom:10px;">You lost :(</h1>' +
        "Press 'space' to retry...</div>";
    }
  } else {
    menuDiv.innerHTML =
      '<div style="text-align:center;padding-top:40px;">' +
      '<h1 style="font-size:52px;margin-bottom:10px;">Player ' + (leftWon ? '1' : '2') + ' Wins!</h1>' +
      "Press 'space' for rematch...</div>";
  }
  menuDiv.style.display = 'block';
  canvas.style.display  = 'none';
  showBottomBar();
}

function startNextPoint() {
  initRound(leftWon);
  updatesToPaint = 0; updateCount = 0;
  gameState = GAME_STATE_RUNNING;
}

function endPoint() {
  if(slimeAI) {
    keysDown[KEY_UP] = false; keysDown[KEY_RIGHT] = false; keysDown[KEY_LEFT] = false;
  }
  if(slimeLeftScore  >= WIN_AMOUNT) { endMatch(true);  return; }
  if(slimeRightScore >= WIN_AMOUNT) { endMatch(false); return; }
  if(onePlayer) {
    endOfPointText = leftWon ? 'Nice, you got the point!' : slimeAI.name + ' scores!';
  } else {
    endOfPointText = 'Player ' + (leftWon ? '1':'2') + ' scores!';
  }
  gameState = GAME_STATE_POINT_PAUSE;
  requestAnimationFrame(renderEndOfPoint);
  setTimeout(function() {
    if(gameState == GAME_STATE_POINT_PAUSE) startNextPoint();
  }, 700);
}

function initRound(server) {
  ball.x = server ? 200 : 800; ball.y = 356;
  ball.velocityX = 0; ball.velocityY = 0;
  slimeLeft.x  = 200; slimeLeft.y  = 0; slimeLeft.velocityX  = 0; slimeLeft.velocityY  = 0;
  slimeRight.x = 800; slimeRight.y = 0; slimeRight.velocityX = 0; slimeRight.velocityY = 0;
}

function updateWindowSize(width,height) {
  viewWidth = width; viewHeight = height;
  pixelsPerUnitX = width  / gameWidth;
  pixelsPerUnitY = height / gameHeight;
  courtYPix = 4 * viewHeight / 5;
}

function setupView(view) {
  view.style.position = 'absolute';
  view.style.left = '0';
  view.style.top  = '0';
}

function bodyload() {
  var contentDiv = document.getElementById('GameContentDiv');

  canvas = document.createElement('canvas');
  canvas.width  = 750;
  canvas.height = 375;
  setupView(canvas);
  canvas.style.display = 'none';
  ctx = canvas.getContext("2d");
  ctx.font = "20px Georgia";
  gameWidth = 1000; gameHeight = 1000;
  updateWindowSize(canvas.width, canvas.height);
  contentDiv.appendChild(canvas);

  menuDiv = document.createElement('div');
  setupView(menuDiv);
  menuDiv.style.width  = '750px';
  menuDiv.style.height = '375px';
  menuDiv.style.background = "#ca6 url('sky2.jpg') no-repeat";
  contentDiv.appendChild(menuDiv);

  logString = '';
  nextSlimeIndex = 0;
  ball       = newLegacyBall(25, '#ff0');
  slimeLeft  = newLegacySlime(true,  100, '#0f0');
  slimeRight = newLegacySlime(false, 100, '#f00');

  var localSkyImage = new Image();
  localSkyImage.src = 'sky2.jpg';
  localSkyImage.onload = function() { backImages['sky'] = this; };

  var localCaveImage = new Image();
  localCaveImage.src = 'cave.jpg';
  localCaveImage.onload = function() { backImages['cave'] = this; };

  var sunsetImage = new Image();
  sunsetImage.src = 'sunset.jpg';
  sunsetImage.onload = function() { backImages['sunset'] = this; };

  var localBallImage = new Image();
  localBallImage.src = 'vball.png';
  localBallImage.onload = function() { ballImage = this; };

  greenSlimeImage = new Image();
  greenSlimeImage.src = 'slime175green.png';
  redSlimeImage = new Image();
  redSlimeImage.src = 'slime175red.png';

  toInitialMenu();
  connectLobby();
}

function start(startAsOnePlayer) {
  onePlayer = startAsOnePlayer;
  slimeLeftScore = 0; slimeRightScore = 0;
  slimeLeft.img = greenSlimeImage;
  if(onePlayer) {
    var slimeAIProps = slimeAIs[nextSlimeIndex];
    slimeRight.color      = slimeAIProps.color;
    legacySkyColor        = slimeAIProps.legacySkyColor;
    backImage             = backImages[slimeAIProps.backImageName];
    backTextColor         = slimeAIProps.backTextColor;
    legacyGroundColor     = slimeAIProps.legacyGroundColor;
    legacyBallColor       = slimeAIProps.legacyBallColor;
    newGroundColor        = slimeAIProps.newGroundColor;
    slimeRight.img        = null;
    slimeAI               = newSlimeAI(false, slimeAIProps.name);
    slimeAIProps.initAI(slimeAI);
  } else {
    legacySkyColor   = '#00f'; backImage = backImages['sky'];
    backTextColor    = '#000'; legacyGroundColor = '#888';
    legacyBallColor  = '#fff'; newGroundColor    = '#ca6';
    slimeRight.img   = redSlimeImage; slimeAI = null;
  }
  initRound(true);
  updatesToPaint = 0; updateCount = 0;
  loadOptions();
  gameState = GAME_STATE_RUNNING;
  renderBackground();
  canvas.style.display = 'block';
  menuDiv.style.display = 'none';
  hideBottomBar();
  gameIntervalObject = setInterval(gameIteration, 20);
}

function toInitialMenu() {
  onlineMode = false;
  canvas.style.display  = 'none';
  menuDiv.style.display = 'block';
  menuDiv.innerHTML     = '';
  showBottomBar();
}

function loadOptions() {
  legacyGraphics = document.getElementById('LegacyGraphics').checked;
  slowMotion     = document.getElementById('SlowMotion').checked;
  physicsLog     = document.getElementById('PhysicsLog').checked ? 120 : 0;
}
function showOptions() {
  if(gameState == GAME_STATE_RUNNING)      gameState = GAME_STATE_MENU_PAUSE;
  else if(gameState == GAME_STATE_POINT_PAUSE) gameState = GAME_STATE_MENU_PAUSE_BETWEEN_POINTS;
  document.getElementById('OptionsDiv').style.display = 'block';
}
function hideOptions() {
  document.getElementById('OptionsDiv').style.display = 'none';
  if(gameState == GAME_STATE_MENU_PAUSE) {
    updateCount = 0; gameState = GAME_STATE_RUNNING;
  } else if(gameState == GAME_STATE_MENU_PAUSE_BETWEEN_POINTS) {
    startNextPoint();
  }
  loadOptions();
}

</script>
</head><body onload="bodyload()">

<div id="LobbyWrapper">

  <div id="TopBar">
    <span id="VersionText">v1.0</span>
    <span id="AnnouncementText">Slime Volleyball &mdash; Play online with friends!</span>
  </div>

  <div id="MiddleRow">

    <div id="ContentDiv">
      <div id="GameContentDiv"></div>
      <div id="OptionsDiv" style="position:absolute;width:400px;height:360px;top:0;left:175px;background:#eee;display:none;border:3px solid #ca6;z-index:10;">
        <h2>Options</h2><hr/><br/>
        <span class="SmallButton" onclick="hideOptions()" style="position:absolute;top:5px;right:5px;font-weight:bold;">close</span>
        <div style="text-align:left;margin:10px;">
          <input id="LegacyGraphics" type="checkbox">Legacy Graphics</input>
          <br/><br/>
          <h3>Debug Options</h3><br/>
          <input id="PhysicsLog" type="checkbox">Enable Physics Log</input>
          <br/><br/>
          <h3>Cheats</h3><br/>
          <input id="SlowMotion" type="checkbox">Slow Motion</input>
        </div>
      </div>
    </div>

    <div id="Sidebar">
      <div id="PlayerCountDiv">● 0 players online</div>
      <div id="ChatLog"></div>
      <div id="ChatInputRow">
        <input id="ChatInput" type="text" placeholder="Chat..." maxlength="200"
               onkeydown="if(event.key==='Enter')sendChat()">
        <button id="ChatSendBtn" onclick="sendChat()">&#10148;</button>
      </div>
    </div>

  </div>

  <div id="BottomBar">
    <span class="bigBtn" onclick="startOnline()">QUICK PLAY</span>
    <span class="bigBtn" onclick="start(false)">PRIVATE MATCH</span>
    <span class="bigBtn" onclick="start(true)">ONE PLAYER</span>
    <span id="OptionsBtn" onclick="showOptions()">OPTIONS</span>
  </div>

</div>

</body></html>
