<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<script src="ws-config.js"></script>
<script src="js/core/theme.js"></script>
<script src="progression.js" defer></script>
<link rel="stylesheet" href="css/slime.css">
<link rel="stylesheet" href="css/components/touch-controls.css">
<!-- page components -->
<script type="text/javascript" src="js/components/options-panel.js" defer></script>
<script type="text/javascript" src="js/components/hat-fullscreen.js" defer></script>
<!-- core: input -->
<script type="text/javascript" src="js/core/input.js" defer></script>
<script type="text/javascript" src="js/core/touch-controls.js" defer></script>
<!-- ai: CPU opponents -->
<script type="text/javascript" src="js/ai/slime-ai.js" defer></script>
<script type="text/javascript" src="js/ai/pathetic-white.js" defer></script>
<script type="text/javascript" src="js/ai/angry-red.js" defer></script>
<script type="text/javascript" src="js/ai/slime-master.js" defer></script>
<script type="text/javascript" src="js/ai/roster.js" defer></script>
<script type="text/javascript" src="js/ai/mental-slime.js" defer></script>
<script type="text/javascript" src="js/ai/final4-roster.js" defer></script>

<script type="text/javascript" src="js/game/state.js" defer></script>
<script type="text/javascript" src="js/game/entities.js" defer></script>
<script type="text/javascript" src="js/game/physics.js" defer></script>
<!-- account -->
<script type="text/javascript" src="js/account/accounts.js" defer></script>
<script type="text/javascript" src="js/account/profile.js" defer></script>
<script type="text/javascript" src="js/account/inventory.js" defer></script>
<!-- game: courts and rendering -->
<script type="text/javascript" src="js/game/maps/map-00.js" defer></script><script type="text/javascript" src="js/game/maps/map-01.js" defer></script><script type="text/javascript" src="js/game/maps/map-02.js" defer></script><script type="text/javascript" src="js/game/maps/map-03.js" defer></script><script type="text/javascript" src="js/game/maps/map-04.js" defer></script><script type="text/javascript" src="js/game/maps/map-05.js" defer></script><script type="text/javascript" src="js/game/maps/map-06.js" defer></script><script type="text/javascript" src="js/game/maps/map-07.js" defer></script><script type="text/javascript" src="js/game/maps/map-08.js" defer></script><script type="text/javascript" src="js/game/maps/map-09.js" defer></script><script type="text/javascript" src="js/game/maps/map-10.js" defer></script><script type="text/javascript" src="js/game/maps/map-11.js" defer></script><script type="text/javascript" src="js/game/maps/map-12.js" defer></script><script type="text/javascript" src="js/game/maps/map-13.js" defer></script><script type="text/javascript" src="js/game/maps/map-14.js" defer></script><script type="text/javascript" src="js/game/maps/map-15.js" defer></script><script type="text/javascript" src="js/game/map-backgrounds.js" defer></script><script type="text/javascript" src="js/game/render.js" defer></script><script type="text/javascript" src="js/game/match-flow.js" defer></script>
<!-- core: page chrome and screen ownership -->
<script type="text/javascript" src="js/core/page-chrome.js" defer></script>
<script type="text/javascript" src="js/core/screen.js" defer></script>
<!-- online: connection, chat, match state -->
<script type="text/javascript" src="js/online/connection.js" defer></script>
<script type="text/javascript" src="js/customization/state.js" defer></script>
<script type="text/javascript" src="js/game/sprites.js" defer></script>
<script type="text/javascript" src="js/online/chat.js" defer></script>
<script type="text/javascript" src="js/online/match-state.js" defer></script>
<script type="text/javascript" src="js/online/players-online.js" defer></script>
<!-- lobby: map art -->
<script type="text/javascript" src="js/lobby/map-thumbnails.js" defer></script>
<script type="text/javascript" src="js/lobby/map-thumbnail-art.js" defer></script>
<!-- account: cards -->
<script type="text/javascript" src="js/account/feature-cards.js" defer></script>
<script type="text/javascript" src="js/account/calling-cards.js" defer></script>
<!-- tournament -->
<script type="text/javascript" src="js/tournament/bracket.js" defer></script>
<script type="text/javascript" src="js/tournament/match-flow.js" defer></script>
<script type="text/javascript" src="js/tournament/hub.js" defer></script>
<script type="text/javascript" src="js/tournament/online-lobby.js" defer></script>
<script type="text/javascript" src="js/tournament/spectate.js" defer></script>
<!-- online: match effects -->
<script type="text/javascript" src="js/online/match-effects.js" defer></script>
<!-- lobby: room browser -->
<script type="text/javascript" src="js/lobby/lobby-select.js" defer></script>
<script type="text/javascript" src="js/lobby/map-browser.js" defer></script>
<script type="text/javascript" src="js/lobby/rooms.js" defer></script>
<!-- menus: dev tools and shortcuts -->
<script type="text/javascript" src="js/menus/dev-menu.js" defer></script>
<script type="text/javascript" src="js/core/shortcuts.js" defer></script>
<!-- online: matches -->
<script type="text/javascript" src="js/online/server-messages.js" defer></script>
<script type="text/javascript" src="js/online/online-match.js" defer></script>
<script type="text/javascript" src="js/online/pregame-overlay.js" defer></script>
<!-- menus: home, scaling, final 4, ranked -->
<script type="text/javascript" src="js/menus/home.js" defer></script>
<script type="text/javascript" src="js/slimeverse/loader.js" defer></script>
<script type="text/javascript" src="js/menus/game-scale.js" defer></script>
<script type="text/javascript" src="js/game/final4.js" defer></script>
<script type="text/javascript" src="js/online/ranked-queue.js" defer></script>
<!-- game: replays -->
<script type="text/javascript" src="js/game/replay.js" defer></script>
<!-- customization -->
<script type="text/javascript" src="js/customization/hats.js" defer></script>
<script type="text/javascript" src="js/customization/hat-art.js" defer></script>
<script type="text/javascript" src="js/customization/slime-preview.js" defer></script>
<script type="text/javascript" src="js/customization/hat-studio.js" defer></script>
<script type="text/javascript" src="js/customization/hat-drawings.js" defer></script>
<script type="text/javascript" src="js/customization/hat-draw-tools.js" defer></script>
<!-- menus: settings and esc menu -->
<script type="text/javascript" src="js/menus/settings.js" defer></script>
<script type="text/javascript" src="js/customization/customize-panel.js" defer></script>
<script type="text/javascript" src="js/menus/esc-menu.js" defer></script>
<!-- account: wallet -->
<script type="text/javascript" src="js/account/wallet.js" defer></script>
<!-- core: audio, perf, boot (bootstrap must load last) -->
<script type="text/javascript" src="js/core/audio.js" defer></script>
<script type="text/javascript" src="js/core/perf-overlay.js" defer></script>
<script type="text/javascript" src="js/core/bootstrap.js" defer></script>
<!-- The Slimeverse loads on demand: see js/slimeverse/loader.js -->
</head><body onload="bodyload()">
<div id="LobbyWrapper">

  <div id="TopBar">
    <span id="VersionText">v2.0</span>
    <span id="AnnouncementText">// SLIME VOLLEYBALL // ONLINE MULTIPLAYER //</span>
    <button id="TopWalletBtn" class="top-wallet-btn" type="button" onclick="connectSlimeWallet()">CONNECT WALLET</button>
  </div>

  <div id="MiddleRow">

    <div id="ContentDiv">
      <div id="GameContentDiv"></div>

      <!-- ESC pause menu -->
      <div id="EscMenu"></div>

      <!-- Replay overlay (canvas renders underneath; this sits on top for text/buttons) -->
      <div id="ReplayOverlay">
        <div id="ReplayContinue" onclick="confirmReplayExit()">
          <div class="rc-title">CONTINUE</div>
          <div class="rc-sub">CLICK OR ANY KEY</div>
        </div>
      </div>

      <div id="OptionsDiv" style="display:none;">      </div>

      <!-- Dev Menu -->
      <div id="DevMenuDiv">
        <div style="color:#ffaa44;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid rgba(255,180,0,.2);padding-bottom:8px;">&#9881; Developer Console</div>
        <div id="DevStatusLine" style="font-size:8px;color:#666;letter-spacing:1px;margin-bottom:12px;"></div>
        <button class="dev-btn" onclick="devUnlockAll()">&#9889; UNLOCK ALL (SET 999 WINS)</button>
        <button class="dev-btn" onclick="devSetRank('SERGEANT')">&#11088; SET RANK: SERGEANT (6W)</button>
        <button class="dev-btn" onclick="devSetRank('CORPORAL')">&#11088; SET RANK: CORPORAL (3W)</button>
        <button class="dev-btn danger" onclick="devReset()">&#8635; RESET ALL WINS TO 0</button>
        <button class="dev-btn" onclick="toggleDevMenu()" style="margin-top:14px;color:#555;border-color:rgba(255,255,255,.1);">[ CLOSE ]</button>
      </div>
    </div>

    <div id="Sidebar">
      <div id="PlayerCountDiv">&#9679; <span id="PlayerCountNum">0</span> online</div>
      <div id="AccountPanel">
        <div id="AccountGuest">
          <div class="account-title">Account</div>
          <input id="AccountUser" class="account-input" type="text" maxlength="20" placeholder="username">
          <input id="AccountPass" class="account-input" type="password" maxlength="64" placeholder="password">
          <div class="account-actions">
            <button onclick="accountLogin()">LOGIN</button>
            <button onclick="accountRegister()">CREATE</button>
          </div>
          <div id="AccountMessage"></div>
        </div>
        <div id="AccountSignedIn" style="display:none;">
          <div class="account-title">Profile</div>
          <div id="AccountName"></div>
          <div id="AccountStats"></div>
          <div class="account-actions">
            <button onclick="showMyProfile()">VIEW</button>
            <button onclick="openInventory()">INVENTORY</button>
            <button onclick="accountLogout()">LOGOUT</button>
          </div>
        </div>
      </div>
      <div id="LeaderboardPanel">
        <div id="LeaderboardHeader">XP Leaderboard</div>
        <div id="LeaderboardList"></div>
      </div>
      <button id="LeaveRoomBtn" onclick="leaveLobby()">⬅ Leave Room</button>
      <div id="OnlineListPanel">
        <div id="OnlineListHeader">players online</div>
        <div id="OnlineList"></div>
      </div>
      <div id="ChatSection">
        <div id="ChatHeader">
          <span>GLOBAL CHAT:</span>
          <label title="Toggle profanity filtering">
            <input id="ProfanityToggleChat" class="profanity-toggle" type="checkbox" onchange="setProfanityFilter(this.checked)">
            profanity
          </label>
          <button id="ChatLeaveBtn" title="Stop seeing global chat" onclick="leaveGlobalChat()">leave chat</button>
        </div>
        <div id="ChatLog"></div>
        <div id="ChatOptInRow">
          <span id="ChatOptInText">Player messages are hidden until you join.</span>
          <span id="ChatUnreadNote"></span>
          <button id="ChatJoinBtn" onclick="joinGlobalChat()">JOIN CHAT</button>
        </div>
        <div id="ChatInputRow">
          <input id="ChatInput" type="text" placeholder="Chat..." maxlength="200"
                 onkeydown="if(event.key==='Enter')sendChat()">
          <button id="ChatSendBtn" onclick="sendChat()">&#10148;</button>
        </div>
      </div>
    </div>

  </div>

  <div id="BottomBar">
    <span class="verseBtn homeBtn" onclick="enterSlimeverseEye(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();enterSlimeverseEye(this);}" title="Slimeverse Home" data-sigil="HOME" role="button" tabindex="0"><span class="verseIcon" aria-hidden="true"></span><span class="eyeCode" aria-hidden="true">0101 1100 1010 0011</span></span>
    <span class="bigBtn playBtn" onclick="showLobbySelect()" data-sigil="I">QUICK PLAY</span>
    <span class="bigBtn rankedBtn" onclick="joinRankedQueue()" data-sigil="RNK">RANKED</span>
    <span class="bigBtn duoBtn" onclick="start(false)" data-sigil="II">2 PLAYER</span>
    <span class="bigBtn cpuBtn" onclick="start(true)" data-sigil="CPU">VS CPU</span>
    <span class="barDivider" aria-hidden="true"></span>
    <span class="bigBtn bracketBtn" onclick="startTournament()" data-sigil="BR">TOURNAMENT</span>
    <span class="bigBtn cardsBtn" onclick="showProgressionHub()" data-sigil="ID">CARDS</span>
    <span class="barDivider" aria-hidden="true"></span>
    <span class="verseBtn settingsBtn" onclick="showOptions()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showOptions();}" title="Options" data-sigil="SET" role="button" tabindex="0"><span class="verseIcon" aria-hidden="true" data-code="1010011100100110"></span></span>
  </div>

</div>

<div id="PlayerTooltip"></div>
<div id="ProfileOverlay" role="dialog" aria-modal="true" aria-label="Player profile" onclick="if(event.target===this)hideProfile()">
  <div id="ProfileCard">
    <button id="ProfileClose" onclick="hideProfile()">&#10005;</button>
    <div id="ProfileContent"></div>
  </div>
</div>

<div id="InventoryOverlay" role="dialog" aria-modal="true" aria-labelledby="InventoryTitle" onclick="if(event.target===this)hideInventory()">
  <div id="InventoryCard">
    <div id="InventoryHeader">
      <span id="InventoryTitle">// INVENTORY //</span>
      <span id="InventoryCoins"></span>
      <button id="InventoryClose" onclick="hideInventory()">&#10005;</button>
    </div>
    <div id="InventoryGrid"></div>
  </div>
</div>

<!-- Hat Fullscreen Drawing Studio -->
<div id="HatFullscreenOverlay"></div>

</body></html>
